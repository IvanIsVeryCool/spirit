<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo Gallery · Nueva Spirit</title>
<meta name="description" content="Photos from Nueva spirit events.">
<meta name="theme-color" content="#1c2a66">
<meta property="og:title" content="Photo Gallery · Nueva Spirit">
<meta property="og:description" content="Photos from Nueva spirit events.">
<meta property="og:image" content="/share.png">
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/gallery/gallery.css">
<style>
/* The gallery car: the evening sky behind, the photos as prints on it, a lightbox to look through them.
   Same palette and signage as the platform; you arrive through the warm light of the train door. */
:root{
  --sky-top:#1c2a66; --sky-mid:#7468ab; --sky-low:#ffb07a;
  --paper:#f6f0e5; --ink:#16181f; --muted:#5b5e68; --red:#c9272c; --navy:#132047; --amber:#ffad1f;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Public Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --logo:url("/assets/logo.png");
  --gut:clamp(16px,3vw,36px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--sky-top)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%) fixed;color:#fff;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.logo-img{display:block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* the warm light you came through the train door into */
#cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#fffaf0 0%,#ffe2b8 45%,#ffb07a 100%);transition:opacity .9s ease,visibility 0s linear .9s}
#cover.out{opacity:0;visibility:hidden;pointer-events:none}
#cover .logo-img{width:54px;height:54px;color:#a2471e}

/* the station sign, back to the platform */
.hud{display:flex;justify-content:space-between;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) var(--gut) 0}
.sign{display:flex;align-items:center;color:#fff;text-decoration:none;padding:4px 2px;filter:drop-shadow(0 1px 1px rgba(20,10,40,.4)) drop-shadow(0 4px 14px rgba(20,10,40,.35));transition:opacity .3s}
.sign:hover{opacity:.85}
.sign .in{display:flex;align-items:center;gap:14px}
.sign .logo-img{width:30px;height:30px;color:#fff}
.sign .in>span:last-child{display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:1px solid rgba(255,255,255,.5)}
.sign b{display:block;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:15px;line-height:1;letter-spacing:.34em;text-transform:uppercase}
.sign .sub{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:9.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.8);line-height:1}
.sign .sub svg{width:12px;height:12px}

/* heading and album filters */
header.top{padding:clamp(28px,6vw,64px) var(--gut) 0;max-width:1480px;margin:0 auto}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,5vw,56px);line-height:1;letter-spacing:-.015em;text-shadow:0 2px 24px rgba(20,10,40,.3)}
main{max-width:1480px;margin:0 auto;padding:26px var(--gut,clamp(16px,3vw,36px)) calc(56px + env(safe-area-inset-bottom,0px))}
@media (max-width:640px){
  .sign b{font-size:13px;letter-spacing:.28em}.sign .logo-img{width:26px;height:26px}.sign .in{gap:11px}.sign .in>span:last-child{padding-left:11px}
}
</style>
</head>
<body>
<div id="cover" aria-hidden="true"><span class="logo-img"></span></div>
<div class="hud">
  <a class="sign" href="/" aria-label="Back to the platform"><span class="in"><span class="logo-img" aria-hidden="true"></span><span><b>Nueva</b><span class="sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Spirit Line</span></span></span></a>
</div>
<header class="top">
  <h1>Photo Gallery</h1>
  <div class="albums" id="albums" role="group" aria-label="Albums" hidden></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No photos yet.</p>
</main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo" aria-hidden="true">
  <div class="lb-stage" id="lb-stage">
    <img class="lb-img" id="lb-img" alt="">
    <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="lb-foot"><p class="lb-cap" id="lb-cap"></p><p class="lb-meta" id="lb-meta"></p></div>
</div>
<script type="module" src="/gallery/js/app.js"></script>
</body>
</html>
