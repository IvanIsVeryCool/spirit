*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--jr);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.container{max-width:980px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.container{padding-inline:28px}}
[hidden]{display:none!important}

.g-sr{--g:var(--sr);--on-g:var(--on-sr)}
.g-jr{--g:var(--jr);--on-g:var(--on-jr)}
.g-so{--g:var(--so);--on-g:var(--on-so)}
.g-fr{--g:var(--fr);--on-g:var(--on-fr)}

/* Logo */
.logo-img{display:block;background:currentColor;-webkit-mask-image:var(--logo);mask-image:var(--logo);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.mark{width:36px;height:36px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.mark .logo-img{width:28px;height:28px}
.intro-on .site-head .mark .logo-img{visibility:hidden}

/* Header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--white);border-bottom:1px solid var(--line)}
.head-inner{height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand-name{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-name b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name span{font-size:12px;color:var(--muted);font-weight:600}
.head-nav{display:flex;gap:4px}
.head-nav a{text-decoration:none;font-weight:600;font-size:15px;color:var(--muted);padding:8px 12px;border-radius:6px}
.head-nav a:hover{color:var(--ink);background:var(--bg)}

/* Hero band */
.band{background:var(--blue);color:#fff;padding-block:40px 112px}
@media (min-width:720px){.band{padding-block:56px 124px}}
.season{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(46px,8.5vw,84px);line-height:.92;letter-spacing:.005em;margin-top:8px;overflow:hidden}
h1 span{display:block}
.status{margin-top:12px;font-size:clamp(16px,2.2vw,19px);color:rgba(255,255,255,.88);max-width:46ch}
.status b{color:#fff}
.enter h1 span{animation:rise .9s var(--ease) both}
.enter .status{animation:rise .9s var(--ease) .12s both}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* Cards */
.main{margin-top:-84px;display:flex;flex-direction:column;gap:28px;padding-bottom:56px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(14,21,48,.04),0 12px 32px -20px rgba(14,21,48,.25);overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
@media (min-width:720px){.card-head{padding:22px 28px 16px}}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:28px;line-height:1;letter-spacing:.01em}
.card-note{font-size:13px;color:var(--muted)}

/* Standings table */
.cols,.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding-inline:20px}
@media (min-width:720px){.cols,.row{grid-template-columns:64px minmax(0,1fr) 120px 96px;padding-inline:28px;gap:16px}}
.cols{padding-block:10px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
.cols .r,.row .pts,.row .behind{text-align:right}
.cols .b,.row .behind{display:none}
@media (min-width:720px){.cols .b,.row .behind{display:block}}
.board{position:relative}
.row{position:relative;padding-block:16px;background:var(--white);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.lead{background:var(--tint)}
.row.lead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.rank{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--faint);text-align:center}
.row.lead .rank{color:var(--blue)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.badge{flex:none;width:40px;height:40px;border-radius:50%;background:var(--g);color:var(--on-g);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px}
.who-text{display:flex;flex-direction:column;min-width:0}
.who-text b{font-size:18px;font-weight:700;line-height:1.2}
.who-text span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-text .mb{display:none}
@media (max-width:719px){.who-text .cy{display:none}.who-text .mb{display:inline}}
.pts{font-family:var(--display);font-weight:800;font-size:clamp(32px,5vw,44px);line-height:1}
.row.lead .pts{color:var(--blue)}
.behind{font-size:15px;color:var(--muted);font-weight:600}
@media (max-width:420px){.badge{width:34px;height:34px;font-size:15px}.who{gap:10px}}

/* Standings animation: rows start in class order at zero, count up, then move into rank order */
.row{--ty:0px}
.board.armed .row,.board.counting .row{transform:translateY(var(--ty))}
.board.settling .row{transition:transform .9s cubic-bezier(.65,0,.25,1)}
.board.settling .row.lead{z-index:2}
.rank,.behind,.who-text .mb{transition:opacity .4s}
.board.armed .rank,.board.counting .rank,.board.armed .behind,.board.counting .behind,.board.armed .mb,.board.counting .mb{opacity:0}
.board.armed .row.lead,.board.counting .row.lead{background:var(--white)}
.board.armed .row.lead::before,.board.counting .row.lead::before{opacity:0}
.row::before{transition:opacity .4s}
.board.armed .row.lead .pts,.board.counting .row.lead .pts{color:var(--ink)}
.row .pts{transition:color .4s}

/* Results table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
@media (min-width:720px){th:first-child,td:first-child{padding-left:28px}th:last-child,td:last-child{padding-right:28px}}
.t-date{color:var(--muted);white-space:nowrap;width:1%}
.t-event{font-weight:600;min-width:120px}
.t-cls{text-align:right;width:1%;white-space:nowrap}
th.t-cls{text-align:right}
.t-cls .chip{display:inline-grid;place-items:center;min-width:30px;height:20px;padding:0 6px;border-radius:10px;background:var(--g);color:var(--on-g);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:0}
td.t-cls{font-variant-numeric:tabular-nums;color:var(--ink)}
td.t-cls.zero{color:var(--faint)}
td.t-cls.top{font-weight:800;color:var(--blue)}
@media (max-width:520px){table{font-size:14px}th,td{padding-inline:4px}th:first-child,td:first-child{padding-left:14px}th:last-child,td:last-child{padding-right:14px}.t-event{min-width:0}.t-date{white-space:normal;width:44px;line-height:1.2}td.t-cls{font-size:13px}.t-cls .chip{min-width:26px;padding:0 4px;font-size:12px}}
@media (max-width:480px){.brand-name span{display:none}.head-nav a{padding:8px 8px;font-size:14px}}
.empty{padding:28px 20px;color:var(--muted);text-align:center}

/* Footer */
.site-foot{background:var(--navy);color:rgba(255,255,255,.72);padding-block:28px;font-size:14px}
.foot-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.foot-brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700}
.site-foot .mark{background:#fff;color:var(--blue);width:30px;height:30px}
.site-foot .mark .logo-img{width:23px;height:23px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,calc(100% + 40px));visibility:hidden;background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:8px;transition:transform .45s var(--ease);max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0);visibility:visible}

/* Intro */
.intro{position:fixed;inset:0;z-index:100;background:var(--blue);cursor:pointer;--s:min(48vw,220px)}
.intro-ring{position:absolute;left:50%;top:45%;width:calc(var(--s)*1.5);height:calc(var(--s)*1.5);margin:calc(var(--s)*-.75) 0 0 calc(var(--s)*-.75);border-radius:50%;border:2px solid rgba(255,255,255,.3);opacity:0;animation:ring 1.5s var(--ease) .3s}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.3);opacity:0}}
.intro-tag{position:absolute;left:0;right:0;top:calc(45% + var(--s)*.5 + 30px);text-align:center;color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,28px);text-transform:uppercase;letter-spacing:.28em;padding-left:.28em;animation:tagIn .9s var(--ease) .4s both}
@keyframes tagIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro.leaving .intro-tag,.intro.leaving .intro-ring{transition:opacity .2s;opacity:0}
.intro-logo{position:fixed;z-index:101;--s:min(48vw,220px);left:calc(50% - var(--s)/2);top:calc(45% - var(--s)/2);width:var(--s);height:var(--s);color:#fff;pointer-events:none;will-change:transform}
.mark.pop{animation:markPop .5s var(--ease)}
@keyframes markPop{40%{transform:scale(1.2)}100%{transform:scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

section[id]{scroll-margin-top:76px}

</style>

  /* ===================================================================== */

  var GRADES=[
    {id:'sr',name:'Seniors',year:2027,match:/senior/i},
    {id:'jr',name:'Juniors',year:2028,match:/junior/i},
    {id:'so',name:'Sophomores',year:2029,match:/sophomore/i},
    {id:'fr',name:'Freshmen',year:2030,match:/fresh/i}
  ];
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var CACHE_KEY='spirit-cache-'+CONFIG.sheetId;
  var school=(CONFIG.schoolName||'').trim();
  var state={entries:[],loaded:false,error:false,checkedAt:null};
  try{var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c&&c.entries)state.entries=c.entries;}catch(e){}

  /* ---------- helpers ---------- */
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function yy(y){return '’'+String(y).slice(2);}
  function fmt(n){return Number(n).toLocaleString('en-US');}
  function season(){var d=new Date(),y=d.getMonth()>=6?d.getFullYear():d.getFullYear()-1;return y+'–'+String(y+1).slice(2);}
  function totals(entries){var t={};GRADES.forEach(function(g){t[g.id]=0;});entries.forEach(function(e){GRADES.forEach(function(g){t[g.id]+=Number(e.points[g.id]||0);});});return t;}
  function ranked(entries){
    var t=totals(entries);
    var arr=GRADES.map(function(g,i){return {id:g.id,name:g.name,year:g.year,pts:t[g.id],order:i};});
    arr.sort(function(a,b){return b.pts-a.pts||a.order-b.order;});
    var rank=0,prev=null;arr.forEach(function(r,i){if(r.pts!==prev){rank=i+1;prev=r.pts;}r.rank=rank;});
    return arr;
  }
  function newestFirst(entries){return entries.slice().sort(function(a,b){return (b.t||0)-(a.t||0)||b.row-a.row;});}
  function statusLine(entries,r){
    if(!entries.length){
      if(state.error)return 'The standings couldn’t load. Check your connection and refresh the page.';
      if(!state.loaded)return 'Loading the latest standings…';
      return 'No points yet. Standings will appear after the first spirit event.';
    }
    var top=r.filter(function(x){return x.rank===1;});
    if(top.length>1){var n=top.map(function(x){return x.name;});return (n.length>2?n.slice(0,-1).join(', ')+' and '+n[n.length-1]:n.join(' and '))+' are tied for first with <b class="num">'+fmt(top[0].pts)+'</b> points.';}
    var d=r[0].pts-r[1].pts;
    return '<b>'+r[0].name+'</b> lead by <b class="num">'+fmt(d)+'</b> point'+(d===1?'':'s')+' after '+entries.length+' event'+(entries.length===1?'':'s')+'.';
  }

  /* ---------- reading the sheet ---------- */
  function parseCSV(text){
    var rows=[],row=[],f='',q=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
      else if(c==='"')q=true;
      else if(c===','){row.push(f);f='';}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
      else if(c!=='\r')f+=c;
    }
    if(f!==''||row.length){row.push(f);rows.push(row);}
    return rows;
  }
  function parseDate(s){
    s=String(s||'').trim();if(!s)return null;var m;
    if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return new Date(+m[1],+m[2]-1,+m[3]).getTime();
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){var y=+m[3];if(y<100)y+=2000;return new Date(y,+m[1]-1,+m[2]).getTime();}
    var t=Date.parse(s);return isNaN(t)?null:t;
  }
  function parseNum(s){var v=parseFloat(String(s||'').replace(/[^0-9.\-]/g,''));return isFinite(v)?Math.round(v):0;}
  function rowsToEntries(rows){
    if(!rows.length)return [];
    var head=rows[0].map(function(h){return String(h).trim();});
    var col={date:-1,name:-1};
    head.forEach(function(h,i){if(/date|day|when/i.test(h)&&col.date<0)col.date=i;if(/challenge|event|activity|name/i.test(h)&&col.name<0)col.name=i;});
    GRADES.forEach(function(g){col[g.id]=-1;head.forEach(function(h,i){if(g.match.test(h)&&col[g.id]<0)col[g.id]=i;});});
    if(GRADES.every(function(g){return col[g.id]<0;}))throw new Error('columns');
    var out=[];
    rows.slice(1).forEach(function(r,i){
      var name=col.name>-1?String(r[col.name]||'').trim():'';
      var pts={},any=false;
      GRADES.forEach(function(g){var v=col[g.id]>-1?parseNum(r[col[g.id]]):0;if(v){pts[g.id]=v;any=true;}});
      if(!name&&!any)return;
      out.push({row:i,challenge:name||'Spirit points',t:col.date>-1?parseDate(r[col.date]):null,points:pts});
    });
    return out;
  }
  function fetchScores(){
    var url='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(CONFIG.sheetId)+'/gviz/tq?tqx=out:csv&headers=1&_='+Date.now();
    return fetch(url,{cache:'no-store'}).then(function(res){
      if(!res.ok)throw new Error('http '+res.status);
      return res.text();
    }).then(function(text){
      if(/^\s*</.test(text))throw new Error('not shared');
      return rowsToEntries(parseCSV(text));
    });
  }

  /* ---------- page shell ---------- */
  var app=document.getElementById('app');
  app.innerHTML=
    '<header class="site-head"><div class="container head-inner">'
      +'<a class="brand" href="#top"><span class="mark" id="head-mark"><span class="logo-img"></span></span>'
      +'<span class="brand-name"><b>'+esc(school||'Spirit Team')+'</b><span>'+(school?'Spirit Team':'Class spirit points')+'</span></span></a>'
      +'<nav class="head-nav" aria-label="Main"><a href="#standings">Standings</a><a href="#results">Results</a></nav>'
    +'</div></header>'
    +'<section class="band" id="top"><div class="container" id="band">'
      +'<p class="season">'+season()+' Spirit Competition</p>'
      +'<h1><span>Class Standings</span></h1>'
      +'<p class="status" id="status"></p>'
    +'</div></section>'
    +'<div class="container main">'
      +'<section class="card" id="standings" aria-labelledby="st-h"><div class="card-head"><h2 id="st-h">Standings</h2><span class="card-note" id="checked"></span></div>'
        +'<div class="cols" aria-hidden="true"><span class="r" style="text-align:center">Rank</span><span>Class</span><span class="r">Points</span><span class="b r">Behind</span></div>'
        +'<div class="board" id="board"></div></section>'
      +'<section class="card" id="results" aria-labelledby="rs-h"><div class="card-head"><h2 id="rs-h">Results</h2><span class="card-note">Points awarded at each event, newest first</span></div>'
        +'<div id="results-body"></div></section>'
    +'</div>'
    +'<footer class="site-foot"><div class="container foot-inner">'
      +'<span class="foot-brand"><span class="mark"><span class="logo-img"></span></span>'+esc(school?school+' Spirit Team':'Spirit Team')+'</span>'
      +'<span id="foot-note">Scores are posted by the spirit team after each event.</span>'
    +'</div></footer>'
    +'<div class="toast" id="toast" role="status" aria-live="polite"></div>';

  var lastHTML=new WeakMap();
  function setHTML(el,html){if(lastHTML.get(el)===html)return false;lastHTML.set(el,html);el.innerHTML=html;return true;}

  /* ---------- render ---------- */
  function render(){
    var entries=state.entries,r=ranked(entries),started=entries.length>0;
    setHTML(document.getElementById('status'),statusLine(entries,r));

    var b='';
    r.forEach(function(x){
      var lead=started&&x.rank===1;
      var behind=!started?'—':(x.rank===1?'—':'−'+fmt(r[0].pts-x.pts));
      var mob=!started?'Class of '+x.year:(x.rank===1?'Leader':fmt(r[0].pts-x.pts)+' behind');
      b+='<div class="row g-'+x.id+(lead?' lead':'')+'" data-cs="'+x.order+'">'
        +'<span class="rank num">'+(started?x.rank:'–')+'</span>'
        +'<span class="who"><span class="badge">'+yy(x.year)+'</span><span class="who-text"><b>'+x.name+'</b><span><span class="cy">Class of '+x.year+'</span><span class="mb">'+mob+'</span></span></span></span>'
        +'<span class="pts num" data-count="'+x.pts+'">'+fmt(x.pts)+'</span>'
        +'<span class="behind num">'+behind+'</span>'
        +'</div>';
    });
    var changed=setHTML(document.getElementById('board'),b);

    var t;
    if(!entries.length){
      t='<p class="empty">'+(state.error?'Results couldn’t load. Refresh the page to try again.':state.loaded?'No events scored yet.':'Loading results…')+'</p>';
    } else {
      t='<div class="table-wrap"><table><thead><tr><th>Date</th><th>Event</th>'
        +GRADES.map(function(g){return '<th class="t-cls g-'+g.id+'" title="'+g.name+'"><span class="chip">'+yy(g.year)+'</span></th>';}).join('')
        +'</tr></thead><tbody>';
      newestFirst(entries).forEach(function(e){
        var max=Math.max.apply(null,GRADES.map(function(g){return Number(e.points[g.id]||0);}));
        var d=e.t?new Date(e.t).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
        t+='<tr><td class="t-date">'+d+'</td><td class="t-event">'+esc(e.challenge)+'</td>'
          +GRADES.map(function(g){var p=Number(e.points[g.id]||0);return '<td class="t-cls'+(p===0?' zero':'')+(p>0&&p===max?' top':'')+'">'+(p===0?'–':(p>0?'+':'−')+fmt(Math.abs(p)))+'</td>';}).join('')
          +'</tr>';
      });
      t+='</tbody></table></div>';
    }
    setHTML(document.getElementById('results-body'),t);
    renderChecked();
    return changed;
  }
  function renderChecked(){
    var t=state.checkedAt?new Date(state.checkedAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):null;
    document.getElementById('checked').textContent=t?'Updated '+t:'';
    document.getElementById('foot-note').textContent=t?'Scores are posted by the spirit team and checked every minute. Last checked '+t+'.':'Scores are posted by the spirit team after each event.';
  }

  /* ---------- standings animation ---------- */
  function countUp(el,delay){
    var to=Number(el.dataset.count);if(reduce||!to)return;
    el.textContent='0';
    setTimeout(function(){
      var start=null;
      requestAnimationFrame(function step(ts){
        if(start===null)start=ts;
        var p=Math.min(1,(ts-start)/1400),e=1-Math.pow(1-p,3);
        el.textContent=fmt(Math.round(to*e));
        if(p<1)requestAnimationFrame(step);
      });
    },delay||0);
  }
  function whenSeen(el,fn){
    var done=false;function go(){if(!done){done=true;fn();}}
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){if(es.some(function(e){return e.isIntersecting;})){io.disconnect();go();}},{threshold:0.4});
      io.observe(el);
    }
    setTimeout(go,6000);
  }
  var timers=[];
  function playBoard(waitForView){
    var board=document.getElementById('board');if(!board||reduce||!state.entries.length)return;
    timers.forEach(clearTimeout);timers=[];
    board.classList.remove('counting','settling');
    var rows=[].slice.call(board.querySelectorAll('.row'));
    rows.forEach(function(l){l.style.setProperty('--ty','0px');});
    var tops=rows.map(function(l){return l.offsetTop;});
    rows.forEach(function(l,i){l.style.setProperty('--ty',(tops[Number(l.dataset.cs)]-tops[i])+'px');});
    board.classList.add('armed');
    var nums=board.querySelectorAll('[data-count]');
    nums.forEach(function(el){if(Number(el.dataset.count))el.textContent='0';});
    function go(){
      requestAnimationFrame(function(){requestAnimationFrame(function(){
        board.classList.remove('armed');board.classList.add('counting');
        nums.forEach(function(el){countUp(el,100);});
        timers.push(setTimeout(function(){
          board.classList.add('settling');board.classList.remove('counting');
          timers.push(setTimeout(function(){board.classList.remove('settling');rows.forEach(function(l){l.style.removeProperty('--ty');});},1000));
        },1700));
      });});
    }
    if(waitForView)whenSeen(board,go);else go();
  }

  var toastTimer;
  function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},4000);}

  /* ---------- intro: the logo flies into the header ---------- */
  function runIntro(cb){
    var called=false;function done(){if(called)return;called=true;cb();}
    var seen=false;
    try{seen=sessionStorage.getItem('spirit-intro')==='1';}catch(e){}
    if(reduce||seen||!document.body.animate){done();return;}
    try{sessionStorage.setItem('spirit-intro','1');}catch(e){}
    var root=document.documentElement,finished=false,leaving=false;
    var ov=document.createElement('div');ov.className='intro';ov.setAttribute('aria-hidden','true');
    ov.innerHTML='<div class="intro-ring"></div><div class="intro-tag">'+esc(school||'Spirit Points')+'</div>';
    var logo=document.createElement('span');logo.className='intro-logo logo-img';
    document.body.appendChild(ov);document.body.appendChild(logo);
    document.body.classList.add('intro-on');
    var prevOverflow=root.style.overflow;root.style.overflow='hidden';
    window.scrollTo(0,0);
    logo.animate([{transform:'scale(.7)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:800,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
    function finish(){
      if(finished)return;finished=true;
      ov.remove();logo.remove();document.body.classList.remove('intro-on');root.style.overflow=prevOverflow;
      var m=document.getElementById('head-mark');if(m){m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop');}
    }
    function leave(){
      if(leaving)return;leaving=true;clearTimeout(timer);
      try{
        ov.classList.add('leaving');
        var T=document.querySelector('#head-mark .logo-img').getBoundingClientRect(),L=logo.getBoundingClientRect();
        var dx=(T.left+T.width/2)-(L.left+L.width/2),dy=(T.top+T.height/2)-(L.top+L.height/2),sc=T.width/L.width;
        var cx=T.left+T.width/2,cy=T.top+T.height/2,ease='cubic-bezier(.7,0,.2,1)';
        logo.getAnimations().forEach(function(a){a.cancel();});
        var fly=logo.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate('+dx+'px,'+dy+'px) scale('+sc+')'}],{duration:900,easing:ease,fill:'forwards'});
        ov.animate([{clipPath:'circle(150% at '+cx+'px '+cy+'px)'},{clipPath:'circle(0px at '+cx+'px '+cy+'px)'}],{duration:850,delay:80,easing:ease,fill:'forwards'});
        setTimeout(done,250);
        fly.onfinish=finish;setTimeout(finish,1300);
      }catch(e){finish();done();}
    }
    ov.addEventListener('click',leave);
    document.addEventListener('keydown',function k(){document.removeEventListener('keydown',k);leave();});
    var timer=setTimeout(leave,1600);
  }

  /* ---------- boot ---------- */
  var introDone=false,dataReady=false,startedPage=false;
  function maybeStart(){
    if(!introDone||!dataReady||startedPage)return;
    startedPage=true;
    var band=document.getElementById('band');
    if(!reduce){band.classList.add('enter');setTimeout(function(){band.classList.remove('enter');},1400);}
    playBoard(true);
  }
  function load(isRefresh){
    return fetchScores().then(function(entries){
      var before=JSON.stringify(state.entries),prevCount=state.entries.length;
      state.entries=entries;state.loaded=true;state.error=false;state.checkedAt=Date.now();
      try{localStorage.setItem(CACHE_KEY,JSON.stringify({entries:entries,at:state.checkedAt}));}catch(e){}
      var changed=before!==JSON.stringify(entries);
      var boardChanged=render();
      if(isRefresh&&changed){
        if(boardChanged)playBoard(false);
        toast(entries.length>prevCount?'New results: '+newestFirst(entries)[0].challenge:'Standings updated');
      }
    }).catch(function(){
      if(!state.entries.length)state.error=true;
      render();
    });
  }

  document.addEventListener('click',function(ev){
    var a=ev.target.closest('a[href^="#"]');if(!a)return;
    var t=document.getElementById(a.getAttribute('href').slice(1));
    if(t){ev.preventDefault();t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden)load(true);});

  render();
  load(false).then(function(){dataReady=true;maybeStart();});
  setTimeout(function(){dataReady=true;maybeStart();},3500);
  runIntro(function(){introDone=true;maybeStart();});
  setInterval(function(){if(!document.hidden)load(true);},Math.max(15,CONFIG.refreshSeconds)*1000);
})();

</script>
</body>
</html>
