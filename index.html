<!doctype html>

<meta property="og:description" content="Spirit points, the weekly newsletter, events and more. All aboard.">

<style>
/* Layout: a golden-hour 3D platform fills the screen; a white station sign sits top-left, the LED departure board (the menu) bottom-left, and the train's doors are the sections. */
:root{
  --sky-top:#1c2a66; --sky-mid:#7468ab; --sky-low:#ffb07a;
  --paper:#f6f0e5; --ink:#16181f; --muted:#5b5e68; --red:#c9272c; --red-dark:#a61e22;
  --board:#0b0b0e; --amber:#ffad1f; --amber-dim:#7a4f0a; --green:#5dff8f;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Public Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --led:'DotGothic16',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --logo:url("/assets/logo.png");
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 48%,var(--sky-low) 100%);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.logo-img{display:block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}

#station{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
#station.pointer{cursor:pointer}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 40%,transparent 60%,rgba(30,12,30,.35) 100%)}

/* Station sign (brand) and sound pill */
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) clamp(16px,3vw,36px) 0;pointer-events:none}
.hud>*{pointer-events:auto}
.sign{display:flex;align-items:stretch;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px -12px rgba(20,10,40,.55);text-decoration:none}
.sign .bar{width:8px;background:var(--red)}
.sign .in{display:flex;align-items:center;gap:12px;padding:9px 16px 9px 12px}
.sign .logo-img{width:34px;height:34px;color:var(--ink)}
.sign b{display:block;font-family:var(--display);font-stretch:118%;font-weight:850;font-size:20px;line-height:1;letter-spacing:-.01em;text-transform:uppercase}
.sign span.sub{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.sound{display:flex;align-items:center;gap:9px;background:#fff;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 10px 30px -12px rgba(20,10,40,.55);transition:background-color .3s,color .3s}
.hud-r{display:flex;gap:8px;align-items:center}
.replay{display:none}.replay svg{width:13px;height:13px}
body.entered .replay{display:flex}
@media (max-width:640px){.replay .lbl{display:none}.replay{padding:9px 11px}}
.sound .bars{display:flex;align-items:flex-end;gap:2px;height:12px}
.sound .bars i{display:block;width:2px;height:3px;background:currentColor;border-radius:1px}
.sound.on{background:var(--red);color:#fff}
.sound.on .bars i{animation:eq 1s ease-in-out infinite}
.sound.on .bars i:nth-child(2){animation-delay:-.4s}.sound.on .bars i:nth-child(3){animation-delay:-.7s}.sound.on .bars i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* Headline in the sky */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.head{position:fixed;z-index:5;left:clamp(16px,3vw,36px);top:calc(92px + env(safe-area-inset-top,0px));pointer-events:none;color:#fff;max-width:min(640px,calc(100% - 32px));text-shadow:0 2px 24px rgba(40,20,70,.35)}
.head .k{display:inline-block;background:var(--red);color:#fff;border-radius:4px;padding:4px 9px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;text-shadow:none}
.head h1{font-family:var(--display);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(26px,4.2vw,58px);line-height:.95;letter-spacing:-.015em;margin-top:6px}
@media (max-width:760px){.head{top:calc(76px + env(safe-area-inset-top,0px))}.head h1{font-size:clamp(22px,7vw,30px)}}

/* Departures: a split-flap timetable, like the big boards in a station hall. It's the menu. */
.board{--cw:15px;position:fixed;z-index:20;left:clamp(16px,3vw,36px);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(612px,calc(100% - 32px));background:linear-gradient(180deg,#1f2026,#15161a);border-radius:8px;padding:0 0 8px;color:#f3efe6;font-family:var(--body);box-shadow:0 0 0 1px #050506,inset 0 1px 0 rgba(255,255,255,.07),0 30px 60px -20px rgba(10,5,20,.75);overflow:hidden;transform:translateY(24px);opacity:0;transition:opacity .8s var(--ease),transform 1s var(--ease)}
.board.show{opacity:1;transform:none}
.b-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 14px;background:#132047;border-bottom:2px solid #0a0f22}
.b-head .t{display:flex;align-items:center;gap:9px;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.b-head .t svg{width:18px;height:18px;flex:none}
.b-cols,.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center}
.b-cols{padding:8px 14px 3px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8d909b}
.b-cols span:nth-child(3),.b-cols span:nth-child(4){text-align:left}
.row{width:100%;text-align:left;padding:5px 14px;position:relative;transition:background-color .2s}
.row::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:0 2px 2px 0;background:#ffd23f;opacity:0;transition:opacity .2s}
.row:hover,.row.on{background:rgba(255,255,255,.055)}
.row:hover::before,.row.on::before{opacity:1}
.row .d{overflow:hidden}
.flap{display:flex;gap:2px}
.flap i{position:relative;flex:none;display:grid;place-items:center;width:var(--cw);height:calc(var(--cw) * 1.5);border-radius:2px;background:linear-gradient(180deg,#2d2e35 0,#25262c 49%,#1b1c21 51%,#202127 100%);box-shadow:inset 0 -1px 0 rgba(0,0,0,.55),0 1px 1px rgba(0,0,0,.4);font-style:normal;font-weight:700;font-size:calc(var(--cw) * .98);line-height:1;color:#f3efe6;text-transform:uppercase;backface-visibility:hidden}
.flap i::after{content:"";position:absolute;left:0;right:0;top:calc(50% - .5px);height:1px;background:rgba(0,0,0,.8)} /* the split between the two flaps */
.flap i.go{animation:flip .08s ease-in}
@keyframes flip{50%{transform:perspective(60px) rotateX(-70deg);filter:brightness(.6)}}
.row .s.live i{color:#7dffa6}
.row .s.due i{color:#ffd23f}
.row .s.soon i{color:#b9bcc6}
@media (max-width:760px){
  .board{--cw:12px;left:12px;right:12px;width:auto}
  .b-cols,.row{grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
  .b-cols,.row{padding-left:10px;padding-right:10px}
  .b-cols .tm,.row .tm,.b-cols .cr,.row .c{display:none}
  .b-cols,.row{grid-template-columns:minmax(0,1fr) auto}
  .flap{gap:1.5px}
  .b-head{padding:8px 10px}.b-head .t{font-size:13px}
}

/* Service notice (sections not open yet) */
.notice{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px}
.notice[hidden]{display:none}
.n-bg{position:absolute;inset:0;background:rgba(28,18,40,.45);opacity:0;transition:opacity .4s}
.n-card{position:relative;width:min(440px,100%);background:var(--paper);border-radius:12px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(20,10,30,.8);opacity:0;transform:translateY(18px) rotate(-1deg);transition:opacity .4s,transform .6s var(--ease)}
.notice.open .n-bg{opacity:1}
.notice.open .n-card{opacity:1;transform:none}
.n-top{background:var(--red);color:#fff;padding:10px 20px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between}
.n-body{padding:22px 22px 24px}
.n-body .car{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.n-body h2{font-family:var(--display);font-stretch:118%;font-weight:850;font-size:clamp(24px,3.4vw,32px);line-height:1;text-transform:uppercase;margin-top:8px}
.n-body p{color:#3b3e47;margin-top:12px}
.n-close{margin-top:20px;background:var(--ink);color:#fff;border-radius:999px;padding:12px 20px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:background-color .25s}
.n-close:hover{background:var(--red)}

/* Meet the Cabinet: name tags over the crew in the cab, and the way back */
#crew{position:fixed;inset:0;z-index:30;pointer-events:none}
#crew .tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 14px 8px;border-radius:7px;background:rgba(255,255,255,.96);color:var(--ink);box-shadow:0 10px 26px -10px rgba(10,8,30,.6),inset 4px 0 0 var(--red);white-space:nowrap;opacity:0;transition:opacity .45s ease;will-change:transform}
#crew .tag.on{opacity:1}
#crew .tag::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(255,255,255,.96)}
#crew .tag b{font-family:var(--display);font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
#crew .tag span{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#crew .tag span:empty{display:none}
.crew-back{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:12px 22px;border-radius:999px;background:#fff;color:var(--ink);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 10px 26px -10px rgba(10,8,30,.6);transition:opacity .5s ease,transform .6s var(--ease)}
body.visiting .crew-back{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media (max-width:560px){#crew .tag{padding:5px 10px 6px}#crew .tag b{font-size:12px}#crew .tag span{font-size:9px}}
#flash{position:fixed;inset:0;z-index:45;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fffaf0 0%,#ffe2b8 45%,#ffb07a 100%);opacity:0;transition:opacity .5s ease}
#flash.on{opacity:1}

/* Loader: a detailed paper ticket over a painted sunset */
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,#4a4a8e 30%,var(--sky-mid) 55%,#f2a07e 82%,var(--sky-low) 100%);transition:opacity 1.3s ease .7s,visibility 0s linear 2.1s}
.quick-load{display:none;position:relative;flex-direction:column;align-items:center;gap:20px;color:#fff}
.quick-load .logo-img{width:56px;height:56px;filter:drop-shadow(0 6px 18px rgba(20,10,40,.5))}
.ql-bar{width:150px;height:2px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.ql-bar i{display:block;height:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
#loader.quick .quick-load{display:flex}#loader.quick .tk-wrap{display:none}
.ql-tap{display:none;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:11px 22px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background-color .25s}
.ql-tap:hover,.ql-tap:focus-visible{background:rgba(255,255,255,.2)}
#loader.tap{cursor:pointer}#loader.tap .ql-bar{display:none}#loader.tap .ql-tap{display:block;animation:qlTap .7s cubic-bezier(.2,.7,.2,1) both,qlPulse 2.4s ease-in-out .7s infinite}
@keyframes qlTap{from{opacity:0;transform:translateY(8px)}}
@keyframes qlPulse{50%{box-shadow:0 0 0 7px rgba(255,255,255,.1)}}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
.sunglow{position:absolute;left:22%;bottom:16%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.95) 0 5%,rgba(255,200,140,.5) 12%,rgba(255,170,120,.18) 32%,transparent 62%);pointer-events:none}
.stars{position:absolute;inset:0 0 55% 0;background-image:radial-gradient(1px 1px at 10% 20%,#fff9 50%,transparent),radial-gradient(1px 1px at 30% 8%,#fff8 50%,transparent),radial-gradient(1px 1px at 55% 15%,#fff7 50%,transparent),radial-gradient(1.5px 1.5px at 72% 6%,#fffa 50%,transparent),radial-gradient(1px 1px at 88% 22%,#fff8 50%,transparent),radial-gradient(1px 1px at 46% 30%,#fff5 50%,transparent);pointer-events:none}
.scenery{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;pointer-events:none}
.tk-wrap{position:relative;perspective:1300px;width:min(720px,100%)}
.ticket{--rx:0deg;--ry:0deg;--hx:50%;--hy:50%;position:relative;display:flex;width:100%;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .5s var(--ease);filter:drop-shadow(0 40px 50px rgba(30,12,40,.55))}
.ticket>.paper{position:absolute;inset:0;border-radius:12px;background-color:var(--paper);background-image:var(--grain-img),repeating-linear-gradient(118deg,rgba(201,39,44,.045) 0 1px,transparent 1px 7px),repeating-linear-gradient(62deg,rgba(28,42,102,.035) 0 1px,transparent 1px 9px);-webkit-mask:radial-gradient(circle 13px at calc(100% - 168px) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 13px at calc(100% - 168px) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 13px at calc(100% - 168px) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 13px at calc(100% - 168px) 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
.tk-main,.tk-stub{position:relative}
.tk-main{flex:1;min-width:0}
.tk-band{display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;border-radius:12px 0 0 0;padding:10px 18px}
.tk-band .logo-img{width:24px;height:24px;color:#fff;flex:none}
.tk-band b{font-family:var(--display);font-stretch:118%;font-weight:850;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.tk-band .ty{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid rgba(255,255,255,.7);border-radius:4px;padding:2px 7px}
.tk-body{padding:16px 20px 16px}
.route{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:14px}
.stop small,.fields dt{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stop b{display:block;font-family:var(--display);font-stretch:112%;font-weight:900;font-size:clamp(18px,3vw,24px);line-height:1;text-transform:uppercase;margin-top:3px}
.stop span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px}
.stop.to{text-align:right}
.route-line{position:relative;height:30px;margin-bottom:12px;min-width:90px}
.route-line::before{content:"";position:absolute;left:6px;right:6px;top:21px;height:4px;background:repeating-linear-gradient(90deg,#8b8377 0 2px,transparent 2px 7px);opacity:.7}
.route-line::after{content:"";position:absolute;left:6px;right:6px;top:22px;height:1.5px;background:var(--ink);opacity:.3}
.route-line .fill{position:absolute;left:6px;right:6px;top:22px;height:2px;background:var(--red);transform-origin:left;transform:scaleX(0)}
.route-line .dot{position:absolute;top:17px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink)}
.route-line .dot.a{left:0}.route-line .dot.b{right:0;border-color:var(--red)}
.mini-train{position:absolute;top:2px;left:0;width:58px;height:22px;transform:scaleX(-1);transition:left .2s linear}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 0;padding:11px 0;border-block:1.5px dashed rgba(22,24,31,.22)}
.fields dd{margin:2px 0 0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-status{display:flex;justify-content:space-between;align-items:center;margin-top:10px;height:18px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.tk-load{display:flex;align-items:center;gap:8px}
.tk-spin{width:11px;height:11px;border-radius:50%;border:2px solid rgba(201,39,44,.25);border-top-color:var(--red);animation:tkSpin .8s linear infinite}
@keyframes tkSpin{to{transform:rotate(360deg)}}
#load-pct{font-variant-numeric:tabular-nums;color:var(--red)}
.tk-status.done .tk-spin{animation:none;border:0;background:#2fa35a;width:8px;height:8px;margin:0 2px;box-shadow:0 0 0 3px rgba(47,163,90,.2)}
.tk-status.done #load-pct{opacity:0;transition:opacity .4s}
.ql-label{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-top:-8px}
#loader.tap .ql-label{display:none}
.gate{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px;opacity:.35;pointer-events:none;transition:opacity .5s}
.gate.ready{opacity:1;pointer-events:auto}
.enter-btn{background:var(--red);color:#fff;border-radius:999px;padding:13px 22px;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transition:background-color .25s,transform .3s var(--ease);box-shadow:0 8px 18px -8px rgba(201,39,44,.8)}
.enter-btn:hover{background:var(--red-dark);transform:translateY(-2px)}
.quiet-btn{font-size:13px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:4px;padding:6px 2px}
.quiet-btn:hover{color:var(--red)}
.fine{margin-top:12px;font-size:10.5px;line-height:1.45;color:#7a7568}
.tk-stub{flex:none;width:168px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 12px 14px 16px;border-left:2px dashed rgba(22,24,31,.25)}
.admit{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);text-align:center;line-height:1.05}
.holo{position:relative;width:78px;height:78px;border-radius:50%;overflow:hidden;background:conic-gradient(from 0deg at var(--hx) var(--hy),#ff8fd0,#ffd27a,#9dffb0,#7fd8ff,#b49bff,#ff8fd0);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.2)}
.holo::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 5px);mix-blend-mode:overlay}
.holo::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);transform:translateX(calc((var(--hx) - 50%) * 1.4));mix-blend-mode:soft-light}
.holo .logo-img{position:absolute;inset:16px;color:rgba(255,255,255,.9);mix-blend-mode:overlay}
.barcode{display:flex;align-items:stretch;gap:1.5px;height:44px;width:100%}
.barcode i{background:var(--ink);flex:none}
.serial{font-family:var(--led);font-size:12px;letter-spacing:.08em;color:var(--ink)}
.hole{position:absolute;right:20px;top:14px;width:22px;height:22px;border-radius:50%;background:#5b4d84;box-shadow:inset 0 2px 4px rgba(0,0,0,.45);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.punched .hole{transform:scale(1)}
.stamp{position:absolute;right:120px;top:46%;display:flex;flex-direction:column;align-items:center;padding:6px 14px;border:3px double var(--red);border-radius:8px;color:var(--red);font-family:var(--display);font-stretch:118%;transform:rotate(-14deg) scale(1.9);opacity:0;mix-blend-mode:multiply;pointer-events:none;transition:transform .32s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.stamp b{font-weight:900;font-size:22px;letter-spacing:.1em;text-transform:uppercase;line-height:1}
.stamp span{font-family:var(--led);font-size:11px;letter-spacing:.06em;margin-top:2px}
.stamped .stamp{transform:rotate(-14deg) scale(1);opacity:.82}
#loader.out .ticket{transition:transform 1.1s cubic-bezier(.6,0,.3,1) .5s,opacity .7s ease .75s;transform:translateY(55vh) rotateX(50deg) scale(.6);opacity:0}
@media (max-width:640px){
  .ticket{flex-direction:column}
  .ticket>.paper{-webkit-mask:none;mask:none}
  .tk-band{border-radius:12px 12px 0 0}
  .route{grid-template-columns:1fr 1fr;row-gap:4px}.route-line{grid-column:1/-1;grid-row:2;margin:0}
  .tk-stub{width:auto;flex-direction:row;flex-wrap:wrap;justify-content:space-between;border-left:0;border-top:2px dashed rgba(22,24,31,.25);padding:12px 16px}
  .tk-stub .barcode{width:120px;height:34px}.holo{width:56px;height:56px}.holo .logo-img{inset:11px}.admit{font-size:13px}
  .stamp{right:24px;top:auto;bottom:70px}
  .hole{right:auto;left:50%;top:auto;bottom:-11px;margin-left:-11px}
}
.skip{position:fixed;z-index:30;right:clamp(16px,3vw,36px);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .6s}
body.intro .skip{opacity:1;pointer-events:auto}
body.intro .hud,body.intro .head,body.intro .board{opacity:0!important;pointer-events:none}
.hud,.head{transition:opacity 1s var(--ease),transform 1.2s var(--ease)}
body.pre .hud,body.pre .head{opacity:0;transform:translateY(-14px)}
.hud{transition-delay:1.2s}.head{transition-delay:1.5s}
/* stepping through a door: the platform UI gets out of the way */
body.boarding .hud,body.boarding .head,body.boarding .board{opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .6s var(--ease);transition-delay:0s;pointer-events:none}

/* Without WebGL or with reduced motion: the board becomes the page */
body.static{overflow:auto}
body.static #station,body.static .vignette{display:none}
body.static .head{position:relative;left:auto;top:auto;padding:110px 20px 0;max-width:640px;margin:0 auto}
body.static #title{position:relative;width:auto;height:auto;margin:0 auto;clip:auto;overflow:visible;white-space:normal;padding:110px 20px 0;max-width:640px;color:#fff;font-family:var(--display);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(26px,6vw,48px);line-height:.95}
body.static .board{position:relative;left:auto;bottom:auto;opacity:1;transform:none;margin:24px auto 40px;width:min(560px,calc(100% - 32px))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="pre">
<canvas id="station" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div id="loader" role="dialog" aria-label="Your ticket">
  <div class="stars" aria-hidden="true"></div>
  <div class="sunglow" aria-hidden="true"></div>
  <svg class="scenery" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 230 C140 170 260 210 380 180 C520 140 640 200 780 170 C920 140 1060 190 1200 160 C1300 140 1380 170 1440 160 V400 H0Z" fill="#8a75a8"/>
    <path d="M0 270 C160 230 300 260 460 228 C600 200 760 250 900 226 C1060 200 1220 244 1440 214 V400 H0Z" fill="#6b5a92"/>
    <path d="M0 312 C200 282 360 300 560 284 C740 270 900 296 1100 280 C1260 268 1360 286 1440 278 V400 H0Z" fill="#45406e"/>
    <g fill="#2b2a46"><path d="M0 352 C160 338 320 346 520 340 C720 334 920 348 1120 340 C1280 334 1380 342 1440 340 V400 H0Z"/>
      <path d="M262 352 L268 210 L274 352Z"/><path d="M268 212 c-40 -6 -70 14 -84 30 c26 -14 54 -20 84 -26z M268 212 c40 -8 72 8 88 24 c-28 -12 -58 -16 -88 -20z M268 210 c-20 -22 -48 -30 -68 -28 c24 6 46 16 68 28z M268 210 c18 -24 46 -34 70 -34 c-26 8 -48 20 -70 34z"/>
      <path d="M1164 350 L1169 240 L1174 350Z"/><path d="M1169 242 c-34 -6 -60 12 -72 26 c22 -12 46 -18 72 -22z M1169 242 c34 -6 60 8 74 22 c-24 -10 -50 -14 -74 -18z M1169 240 c-16 -18 -40 -26 -58 -24 c20 6 40 14 58 24z M1169 240 c16 -20 40 -28 60 -28 c-22 6 -42 16 -60 28z"/></g>
    <g stroke="#2b2a46" stroke-width="1.5" fill="none" opacity=".75"><path d="M0 262 Q180 276 360 262 T720 262 T1080 262 T1440 262"/><path d="M0 274 H1440"/></g>
    <g fill="#2b2a46"><rect x="352" y="238" width="5" height="120"/><rect x="1072" y="238" width="5" height="120"/></g>
  </svg>
  <div class="quick-load"><span class="logo-img" aria-hidden="true"></span><div class="ql-bar" aria-hidden="true"><i id="ql-bar"></i></div><span class="ql-label" role="status">Loading</span><button class="ql-tap" id="ql-tap" type="button" tabindex="-1">Tap to board</button></div>
  <div class="tk-wrap" id="tk-wrap">
    <div class="ticket" id="ticket">
      <div class="paper" aria-hidden="true"></div>
      <div class="tk-main">
        <div class="tk-band"><span class="logo-img" aria-hidden="true"></span><b id="tk-name">Nueva Spirit Line</b></div>
        <div class="tk-body">
          <div class="route">
            <div class="stop"><small>From</small><b>Campus</b></div>
            <div class="route-line" aria-hidden="true">
              <i class="dot a"></i><i class="fill" id="load-bar"></i><i class="dot b"></i>
              <svg class="mini-train" id="mini-train" viewBox="0 0 58 22"><path d="M8 3 H54 a3 3 0 0 1 3 3 V17 H2 V11 Q2 4 8 3Z" fill="#e9ebef" stroke="#16181f" stroke-width="1.2"/><path d="M2 11 Q2 4 8 3 H14 V17 H2Z" fill="#c9272c"/><rect x="18" y="6" width="7" height="5" rx="1" fill="#16181f"/><rect x="28" y="6" width="7" height="5" rx="1" fill="#16181f"/><rect x="38" y="6" width="7" height="5" rx="1" fill="#16181f"/><rect x="48" y="6" width="6" height="5" rx="1" fill="#16181f"/><rect x="14" y="14" width="43" height="3" fill="#c9272c"/><circle cx="14" cy="19" r="2.2" fill="#16181f"/><circle cx="46" cy="19" r="2.2" fill="#16181f"/></svg>
            </div>
            <div class="stop to"><small>To</small><b>Spirit Cabinet</b></div>
          </div>
          <dl class="fields">
            <div><dt>Date</dt><dd id="tk-date"></dd></div>
            <div><dt>Departs</dt><dd id="tk-time"></dd></div>
            <div><dt>Platform</dt><dd>1</dd></div>
          </dl>
          <div class="tk-status" id="tk-status" role="status"><span class="tk-load"><i class="tk-spin" aria-hidden="true"></i><span id="load-label">Loading the station</span></span><span id="load-pct">0%</span></div>
          <div class="gate" id="gate">
            <button class="enter-btn" id="enter-sound" type="button">Board with sound</button>
            <button class="quiet-btn" id="enter-quiet" type="button">Board without sound</button>
          </div>
        </div>
      </div>
      <div class="tk-stub">
        <span class="admit">Admit<br>one</span>
        <div class="holo" aria-hidden="true"><span class="logo-img"></span></div>
        <div class="barcode" id="barcode" aria-hidden="true"></div>
        <span class="serial" id="tk-serial"></span>
        <i class="hole" aria-hidden="true"></i>
      </div>
      <div class="stamp" aria-hidden="true"><b>Validated</b><span id="stamp-date"></span></div>
    </div>
  </div>
</div>

<button class="skip" id="skip" type="button">Skip intro</button>

<header class="hud">
  <a class="sign" href="/"><span class="bar" aria-hidden="true"></span><span class="in"><span class="logo-img" aria-hidden="true"></span><span><b id="brand-name">Nueva</b><span class="sub">Spirit Cabinet</span></span></span></a>
  <div class="hud-r">
    <button class="sound replay" id="replay-btn" type="button" aria-label="Replay the intro"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8a4.5 4.5 0 1 0 1.4-3.26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 2.2v3.3h3.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Replay intro</span></button>
    <button class="sound" id="sound-btn" type="button" aria-pressed="false"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="sound-label">Sound off</span></button>
  </div>
</header>

<h1 class="sr-only" id="title">Nueva Spirit Cabinet</h1>

<nav class="board" id="board" aria-label="Sections">
  <div class="b-head"><span class="t"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 10h14M9 19l-2 3M15 19l2 3M9 14h.01M15 14h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Departures</span><span class="flap" id="clock" aria-hidden="true"></span></div>
  <div class="b-cols" aria-hidden="true"><span class="tm">Time</span><span>Destination</span><span class="cr">Car</span><span>Status</span></div>
  <div id="rows"></div>
</nav>

<div class="notice" id="notice" role="dialog" aria-modal="true" aria-labelledby="n-title" hidden>
  <div class="n-bg" data-close></div>
  <div class="n-card">
    <div class="n-top"><span>Service notice</span><span id="n-car"></span></div>
    <div class="n-body">
      <p class="car">Not running yet</p>
      <h2 id="n-title"></h2>
      <p id="n-text"></p>
      <button class="n-close" type="button" data-close>Back to the platform</button>
    </div>
  </div>
</div>

<div id="crew" hidden><div id="crew-tags" aria-live="polite"></div><button class="crew-back" id="crew-back" type="button">Back to the platform</button></div>
<div id="flash" aria-hidden="true"></div>
<noscript><p style="padding:24px;color:#fff"><a href="/points/">Go to Spirit Points</a></p></noscript>
<script>setTimeout(function(){if(!window.__hubBooted){var l=document.getElementById("loader");if(l)l.remove();document.body.classList.add("static");document.body.classList.remove("pre");}},9000);</script>
<script type="module" src="/hub/hub.js"></script>
</body>
</html>
