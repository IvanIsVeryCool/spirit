/* Layout: a school-site homepage in blue and white. Sticky nav, a royal-blue pep-rally hero with drifting confetti and a tilted ribbon, then a white "race track" where each class runs its own lane, how-it-works, the challenge timeline, and a navy footer. Single committed look (blue on white) in every theme. */
:root{
  color-scheme:light;
  --white:#FFFFFF; --paper:#F3F7FF; --ice:#E6EEFF; --line:#D6E0F5;
  --ink:#0A1A3F; --muted:#4E5E86;
  --blue:#0D27B5; --blue-2:#2E4FE6; --deep:#0A1C85; --night:#050D38; --sky:#9DCBFF;
  --sr:#0B2A6E; --jr:#1E4FD8; --so:#3D8BF2; --fr:#9DCBFF;
  --on-sr:#FFFFFF; --on-jr:#FFFFFF; --on-so:#FFFFFF; --on-fr:#0A1A3F;
  --danger:#C8263C; --amber:#FFB020;
  --display:'Big Shoulders Display','Big Shoulders','Oswald',Impact,'Arial Narrow',sans-serif;
  --body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--white);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.container{max-width:1120px;margin:0 auto;padding-inline:20px}
@media (min-width:760px){.container{padding-inline:32px}}
section[id]{scroll-margin-top:84px}

.g-sr{--g:var(--sr);--on-g:var(--on-sr)}
.g-jr{--g:var(--jr);--on-g:var(--on-jr)}
.g-so{--g:var(--so);--on-g:var(--on-so)}
.g-fr{--g:var(--fr);--on-g:var(--on-fr)}

.logo-img{display:block;background:currentColor;-webkit-mask-image:var(--logo);mask-image:var(--logo);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.brand-mark .logo-img{width:30px;height:30px}
.intro-on .brand-mark .logo-img{visibility:hidden}
.brand-mark.pop{animation:markPop .6s var(--ease)}
@keyframes markPop{35%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.intro{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 50% 42%,#1A3BDB 0%,var(--blue) 40%,var(--night) 100%);overflow:hidden;cursor:pointer;--s:min(52vw,250px)}
.intro::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 34px)}
.intro-ring{position:absolute;left:50%;top:44%;width:calc(var(--s)*1.55);height:calc(var(--s)*1.55);margin:calc(var(--s)*-.775) 0 0 calc(var(--s)*-.775);border-radius:50%;border:2px solid rgba(255,255,255,.35);transform:scale(.5);opacity:0;animation:ring 1.6s var(--ease) .35s 2}
.intro-ring.r2{animation-delay:.75s}
@keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.intro-tag{position:absolute;left:0;right:0;top:calc(44% + var(--s)*.5 + 34px);text-align:center;color:#fff;font-family:var(--display);font-weight:900;font-size:clamp(22px,4.5vw,34px);text-transform:uppercase;letter-spacing:.32em;padding-left:.32em;animation:tagIn 1s var(--ease) .45s both}
@keyframes tagIn{from{opacity:0;letter-spacing:.9em;filter:blur(6px)}to{opacity:1;letter-spacing:.32em;filter:blur(0)}}
.intro-sub{position:absolute;left:0;right:0;top:calc(44% + var(--s)*.5 + 82px);text-align:center;color:rgba(255,255,255,.7);font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;animation:tagIn 1s var(--ease) .7s both}
.intro-bar{position:absolute;left:50%;bottom:12%;width:150px;margin-left:-75px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.intro-bar i{display:block;height:100%;background:#fff;transform-origin:left;animation:load 1.5s cubic-bezier(.6,.05,.3,1) .2s both}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.intro.leaving .intro-tag,.intro.leaving .intro-sub,.intro.leaving .intro-bar,.intro.leaving .intro-ring{transition:opacity .25s;opacity:0}
.intro-logo{position:fixed;z-index:101;left:calc(50% - var(--s)/2);top:calc(44% - var(--s)/2);width:var(--s);height:var(--s);color:#fff;--s:min(52vw,250px);pointer-events:none;will-change:transform}
.intro-skip{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.8);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}

/* ---------- Nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
.nav.scrolled{border-color:var(--line);box-shadow:0 10px 30px -18px rgba(10,26,63,.35)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:17px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;transition:transform .5s var(--ease)}
.brand:hover .brand-mark{transform:rotate(-12deg) scale(1.06)}
.brand-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:none;align-items:center;gap:4px}
.links a{position:relative;text-decoration:none;font-weight:600;font-size:15px;color:var(--muted);padding:8px 14px;border-radius:999px;transition:color .2s,background .2s}
.links a:hover{color:var(--ink);background:var(--paper)}
.links a.active{color:var(--blue)}
.links a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:var(--blue);animation:grow .4s var(--ease)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.links a.cta{background:var(--blue);color:#fff;margin-left:6px}
.links a.cta:hover{background:var(--deep);color:#fff}
.links a.cta.active::after{display:none}
.burger{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.burger span{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;transition:transform .3s var(--ease),opacity .2s}
.burger span+span{margin-top:4px}
.nav.open .burger span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.nav.open .burger span:nth-child(2){opacity:0}
.nav.open .burger span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.nav.open .drawer{grid-template-rows:1fr}
.drawer>div{overflow:hidden}
.drawer nav{display:flex;flex-direction:column;padding-block:4px 16px}
.drawer a{text-decoration:none;font-weight:700;font-size:18px;padding:12px 4px;border-bottom:1px solid var(--line)}
@media (min-width:820px){.links{display:flex}.burger,.drawer{display:none}}

/* ---------- Hero ---------- */
.hero{position:relative;color:#fff;background:linear-gradient(155deg,var(--night) 0%,var(--deep) 42%,var(--blue) 100%);overflow:hidden;padding-block:64px 112px}
@media (min-width:900px){.hero{padding-block:88px 136px}}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 34px);pointer-events:none}
.hero::after{content:"";position:absolute;width:720px;height:720px;right:-200px;top:-260px;border-radius:50%;background:radial-gradient(circle,rgba(157,203,255,.35),transparent 65%);pointer-events:none;animation:glow 9s ease-in-out infinite alternate}
@keyframes glow{from{transform:translate(0,0) scale(1)}to{transform:translate(-80px,60px) scale(1.15)}}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.hero-inner{position:relative;z-index:2;display:grid;gap:44px;align-items:center}
@media (min-width:900px){.hero-inner{grid-template-columns:minmax(0,1.25fr) minmax(0,.95fr);gap:56px}}
.pill{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 14px 6px 10px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;max-width:100%}
.pill span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{position:relative;width:10px;height:10px;border-radius:50%;background:#7CF0B0;flex:none}
.live::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #7CF0B0;animation:ping 1.8s var(--ease) infinite}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.preview-pill{display:inline-flex;margin-left:8px;background:var(--amber);color:var(--night);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;vertical-align:middle}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(76px,16vw,168px);line-height:.84;letter-spacing:-.01em;margin-top:22px}
h1 .line{display:block;overflow:hidden;padding-bottom:.04em}

h1 .outline{color:transparent;-webkit-text-stroke:2.5px #fff}
.enter h1 .line>span{animation:rise 1s var(--ease) both}
.enter h1 .line:nth-child(2)>span{animation-delay:.12s}
@keyframes rise{from{transform:translateY(105%)}to{transform:translateY(0)}}
.lede{font-size:clamp(18px,2.4vw,22px);font-weight:500;max-width:32ch;margin-top:22px;color:rgba(255,255,255,.88)}

.enter .lede,.enter .hero-actions,.enter .cheer,.enter .hero-stats{animation:up .9s var(--ease) both}
.enter .lede{animation-delay:.25s}
.enter .hero-actions{animation-delay:.35s}
.enter .cheer{animation-delay:.45s}
.enter .hero-stats{animation-delay:.55s}
@keyframes up{from{transform:translateY(22px)}to{transform:translateY(0)}}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.white{background:#fff;color:var(--blue);box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.btn.white:hover{box-shadow:0 16px 30px -12px rgba(0,0,0,.55)}
.btn.glass{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.btn.glass:hover{background:rgba(255,255,255,.18)}
.btn svg{transition:transform .25s var(--ease)}
.btn:hover svg{transform:translateX(3px)}
.cheer{margin-top:30px;display:flex;flex-direction:column;gap:10px}
.cheer-label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.cheer-row{display:flex;flex-wrap:wrap;gap:8px}
.cheer-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 14px 5px 5px;font-weight:700;font-size:14px;cursor:pointer;transition:background .2s,transform .2s var(--ease)}
.cheer-btn:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
.cheer-btn .dot{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--g);color:var(--on-g);font-family:var(--display);font-weight:900;font-size:14px;box-shadow:0 0 0 2px #fff}
.cheer-btn.pop{animation:pop .45s var(--ease)}
@keyframes pop{30%{transform:scale(1.14)}100%{transform:scale(1)}}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:40px;padding-top:24px;border-top:1px solid rgba(255,255,255,.18)}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-family:var(--display);font-weight:800;font-size:42px;line-height:1}
.hero-stats span{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:4px}

/* Leader card */
.leader-wrap{position:relative;perspective:1000px}
.enter .leader-wrap{animation:cardIn 1.1s var(--ease) .3s both}
@keyframes cardIn{from{transform:translateY(40px) rotate(4deg)}to{transform:translateY(0) rotate(0)}}
.leader{position:relative;background:#fff;color:var(--ink);border-radius:26px;padding:26px;box-shadow:0 40px 80px -30px rgba(3,10,40,.7);animation:bob 6s ease-in-out infinite;transform-style:preserve-3d;transition:transform .2s ease-out}
@keyframes bob{50%{translate:0 -10px}}
.leader-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.leader-main{display:flex;align-items:center;gap:18px;margin-top:18px}
.patch{flex:none;width:96px;height:96px;border-radius:24px;background:var(--g);display:grid;place-items:center;position:relative;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--g)}
.patch::before{content:"";position:absolute;inset:7px;border:2px dashed var(--on-g);opacity:.5;border-radius:17px}
.patch span{font-family:var(--display);font-weight:900;font-size:46px;line-height:1;color:var(--g);-webkit-text-stroke:6px var(--on-g);paint-order:stroke fill}
.patch.sm{width:58px;height:58px;border-radius:16px;box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--g)}
.patch.sm::before{inset:5px;border-radius:11px}
.patch.sm span{font-size:28px;-webkit-text-stroke:4px var(--on-g)}
.leader-name{font-family:var(--display);font-weight:900;font-size:40px;line-height:.95;text-transform:uppercase}
.leader-pts{font-size:15px;color:var(--muted);margin-top:4px}
.leader-pts b{font-family:var(--display);font-weight:900;font-size:30px;color:var(--blue);margin-right:4px}
.leader-gap{margin-top:16px;background:var(--paper);border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px}
.leader-rest{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.leader-rest li{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.leader-rest .r{width:24px;font-family:var(--display);font-weight:800;color:var(--muted);font-size:18px}
.leader-rest .d{width:10px;height:10px;border-radius:50%;background:var(--g);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--g)}
.leader-rest .p{margin-left:auto;color:var(--muted)}
.opener-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
.opener-row .patch{animation:hop 2.4s var(--ease) infinite}
.opener-row .patch:nth-child(2){animation-delay:.15s}
.opener-row .patch:nth-child(3){animation-delay:.3s}
.opener-row .patch:nth-child(4){animation-delay:.45s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}20%{transform:translateY(-10px)}}
.leader h3{font-family:var(--display);font-weight:900;font-size:36px;text-transform:uppercase;line-height:1;margin-top:20px}
.leader p.sub{color:var(--muted);margin-top:8px}

/* Ribbon */
.ribbon-wrap{position:relative;z-index:3;overflow:hidden;margin-top:-58px;padding-block:22px}
.ribbon{transform:rotate(-2.2deg);background:#fff;border-block:4px solid var(--blue);margin-inline:-4%;box-shadow:0 14px 30px -18px rgba(10,26,63,.5)}
.ribbon-track{display:flex;width:max-content;animation:marquee 38s linear infinite}
.ribbon-track:hover{animation-play-state:paused}
.ribbon-item{display:inline-flex;align-items:center;gap:16px;padding:12px 18px;font-family:var(--display);font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.03em;color:var(--blue);white-space:nowrap}
.ribbon-item .star{color:var(--sky);font-size:22px}
.ribbon-item em{font-style:normal;color:var(--ink)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- Sections ---------- */
.sec{padding-block:80px}
@media (min-width:900px){.sec{padding-block:104px}}
.sec.paper{background:var(--paper)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:36px}
.kicker{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:28px;height:3px;border-radius:3px;background:var(--blue)}
h2{font-family:var(--display);font-weight:900;font-size:clamp(44px,7vw,72px);text-transform:uppercase;line-height:.92;margin-top:10px}
.sec-note{color:var(--muted);max-width:42ch}

/* Race */
.race{display:flex;flex-direction:column;gap:14px}
.lane{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px 14px;transition:transform .35s var(--ease),box-shadow .35s,border-color .35s}

.lrank{font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,60px);line-height:1;color:var(--line);text-align:center}
.lane.lead .lrank{color:var(--blue)}
.lhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lname{font-weight:800;font-size:clamp(18px,2.6vw,22px);display:flex;align-items:center;gap:8px}
.lname small{font-weight:500;font-size:14px;color:var(--muted)}
.crown{color:var(--amber);display:inline-flex;animation:tilt 2.6s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(-12deg) translateY(-2px)}}
.lpts{font-size:14px;color:var(--muted);font-weight:600}
.lpts b{font-family:var(--display);font-weight:900;font-size:clamp(30px,4.6vw,40px);color:var(--ink);margin-right:4px;line-height:1}
.ltrack{margin-top:10px;height:46px;border-radius:999px;background:var(--ice);position:relative;overflow:hidden;background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.9) calc(10% - 2px) 10%)}
.lfill{position:relative;height:100%;width:max(46px,var(--w));border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--g) 45%,#fff),var(--g));display:flex;justify-content:flex-end;align-items:center;transition:width 1.7s var(--ease);overflow:hidden}
.race.armed .lfill{width:46px;transition:none}
.lane.lead .lfill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s ease-in-out 1.8s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.puck{position:relative;z-index:1;flex:none;width:38px;height:38px;margin-right:4px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:16px;box-shadow:0 4px 10px -3px rgba(10,26,63,.45)}
.lgap{margin-top:8px;font-size:14px;color:var(--muted);font-weight:600}
.lane.lead .lgap{color:var(--blue)}

/* Number-only rows */
.lrow{display:flex;align-items:center;gap:clamp(12px,2.4vw,22px);min-width:0}
.lbadge{flex:none;width:clamp(44px,7vw,58px);height:clamp(44px,7vw,58px);border-radius:50%;background:var(--g);color:var(--on-g);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:clamp(18px,3vw,24px);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--g)}
.linfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.linfo .lname{font-size:clamp(19px,3vw,26px)}
.lsub{font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsub .lgap{margin:0;font-weight:700;font-size:14px}
.lane.lead .lsub .lgap{color:var(--blue)}
.lnum{flex:none;text-align:right;line-height:1;display:flex;align-items:baseline;gap:6px}
.lnum b{font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,68px);color:var(--ink);display:inline-block}
.lane.lead .lnum b{color:var(--blue)}
.lnum span{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.race.settling .lnum b{animation:pop .55s var(--ease)}
.race.growing .lnum b{text-shadow:0 0 18px color-mix(in srgb,var(--g) 45%,transparent)}
.crown{max-width:32px;overflow:hidden;transition:max-width .45s var(--ease),margin .45s var(--ease),opacity .45s,transform .5s var(--ease)}
.race.armed .crown,.race.growing .crown{max-width:0;margin-right:-8px}
@media (max-width:480px){.lsub .yr{display:none}.lbadge{display:none}.lsub{white-space:normal}.lnum span{font-size:11px}}

/* Leaderboard animation: armed = level start in class order; growing = bars fill and scores count; settling = rows slide into rank order */
.lane{--ty:0px}
.race.armed .lane,.race.growing .lane{transform:translateY(var(--ty))}
.race.armed .lane{transition:none}
.race.settling .lane{transition:transform 1s cubic-bezier(.65,0,.25,1),box-shadow .35s,border-color .35s}
.lane.lead{position:relative;z-index:2}
@media (max-width:520px){.lhead{flex-wrap:nowrap}.lname small{display:none}.lname{min-width:0;white-space:nowrap}}
.lrank,.lgap,.crown{transition:opacity .45s,transform .5s var(--ease)}
.race.armed .lrank,.race.growing .lrank,.race.armed .lgap,.race.growing .lgap,.race.armed .crown,.race.growing .crown{opacity:0;transform:scale(.6)}
.race.armed .lane.lead,.race.growing .lane.lead{border-color:var(--line);box-shadow:none}
.race.armed .lfill{width:46px;transition:none}
.race.growing .lfill{transition:width 1.8s var(--ease);transition-delay:var(--d,0ms)}

.steps{display:grid;gap:18px}
@media (min-width:820px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.step{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;transition:transform .35s var(--ease),box-shadow .35s}
.step:hover{transform:translateY(-6px);box-shadow:0 30px 50px -34px rgba(10,26,63,.55)}
.step-icon{width:56px;height:56px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;transition:transform .5s var(--ease)}
.step:hover .step-icon{transform:rotate(-8deg) scale(1.08)}
.step-n{font-family:var(--display);font-weight:900;font-size:18px;color:var(--blue);letter-spacing:.08em;margin-top:22px}
.step h3{font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase;line-height:1;margin-top:4px}
.step p{color:var(--muted);margin-top:10px}

/* Timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:14px}
.timeline::before{content:"";position:absolute;left:31px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--blue),var(--line))}
@media (min-width:640px){.timeline::before{left:39px}}
.tl{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:640px){.tl{grid-template-columns:80px minmax(0,1fr);gap:22px}}
.tl-date{position:relative;z-index:1;width:64px;border-radius:16px;background:var(--blue);color:#fff;text-align:center;padding:8px 0 6px;box-shadow:0 0 0 6px #fff;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.06em;line-height:1.1}
@media (min-width:640px){.tl-date{width:80px;font-size:15px}}
.tl-date b{display:block;font-size:30px;font-weight:900}
.tl-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:transform .35s var(--ease),box-shadow .35s,border-color .35s}
.tl-card:hover{transform:translateX(4px);border-color:var(--blue);box-shadow:0 20px 40px -30px rgba(30,79,216,.8)}
.tl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tl-name{font-weight:800;font-size:19px;overflow-wrap:anywhere;min-width:0}
.tl-total{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 12px 4px 4px;background:var(--paper);font-size:14px;font-weight:700}
.chip .dot{display:inline-grid;place-items:center;min-width:32px;height:24px;border-radius:999px;background:var(--g);color:var(--on-g);font-family:var(--display);font-weight:900;font-size:14px;padding:0 7px}
.chip .who{font-weight:500;color:var(--muted)}
.tl.removing .tl-card{opacity:.5}
.tl.removing .tl-name{text-decoration:line-through}
.tl.added .tl-card{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 30%,transparent)}
.tl-actions{display:flex;gap:8px}
.empty{border:2px dashed var(--line);border-radius:24px;padding:40px 24px;text-align:center;color:var(--muted);background:#fff}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:30px;margin-bottom:6px}

/* Reveal on scroll (transform only, always readable) */
.reveal{transition:transform .9s var(--ease)}
.reveal.pending{transform:translateY(36px)}

/* Footer */
.foot{background:var(--night);color:rgba(255,255,255,.75);padding-block:56px 40px}
.foot-inner{display:grid;gap:28px}
@media (min-width:760px){.foot-inner{grid-template-columns:1.4fr 1fr;align-items:end}}
.foot .brand{color:#fff}
.foot .brand-mark{background:#fff;color:var(--blue)}
.foot-big{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,6vw,64px);line-height:.9;color:#fff;margin-top:18px}
.foot-big span{color:var(--sky)}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:flex-start}
@media (min-width:760px){.foot-links{justify-content:flex-end}}
.foot-links a{text-decoration:none;font-weight:600;transition:color .2s}
.foot-links a:hover{color:#fff}
.foot-bottom{margin-top:36px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .reveal.pending{transform:none}
}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;transform:translate(-50%,140%);background:var(--night);color:#fff;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:0 18px 40px -14px rgba(6,18,53,.6);transition:transform .5s var(--ease);max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}

  /* ---------- reading the sheet ---------- */
  function parseCSV(text){
    var rows=[],row=[],f='',q=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
      else if(c==='"')q=true;
      else if(c===','){row.push(f);f='';}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
      else if(c!=='\r')f+=c;
    }
    if(f!==''||row.length){row.push(f);rows.push(row);}
    return rows;
  }
  function parseDate(s){
    s=String(s||'').trim();if(!s)return null;var m;
    if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return new Date(+m[1],+m[2]-1,+m[3]).getTime();
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){var y=+m[3];if(y<100)y+=2000;return new Date(y,+m[1]-1,+m[2]).getTime();}
    var t=Date.parse(s);return isNaN(t)?null:t;
  }
  function parseNum(s){var v=parseFloat(String(s||'').replace(/[^0-9.\-]/g,''));return isFinite(v)?Math.round(v):0;}
  function rowsToEntries(rows){
    if(!rows.length)return [];
    var head=rows[0].map(function(h){return String(h).trim();});
    var col={date:-1,name:-1};
    head.forEach(function(h,i){if(/date|day|when/i.test(h)&&col.date<0)col.date=i;if(/challenge|event|activity|name/i.test(h)&&col.name<0)col.name=i;});
    GRADES.forEach(function(g){col[g.id]=-1;head.forEach(function(h,i){if(g.match.test(h)&&col[g.id]<0)col[g.id]=i;});});
    if(GRADES.every(function(g){return col[g.id]<0;}))throw new Error('columns');
    var out=[];
    rows.slice(1).forEach(function(r,i){
      var name=col.name>-1?String(r[col.name]||'').trim():'';
      var pts={},any=false;
      GRADES.forEach(function(g){var v=col[g.id]>-1?parseNum(r[col[g.id]]):0;if(v){pts[g.id]=v;any=true;}});
      if(!name&&!any)return;
      out.push({row:i,challenge:name||'Spirit points',t:col.date>-1?parseDate(r[col.date]):null,points:pts});
    });
    return out;
  }

      if(!res.ok)throw new Error('http '+res.status);
      return res.text();
    }).then(function(text){
      if(/^\s*</.test(text))throw new Error('not shared');
      return rowsToEntries(parseCSV(text));
    });
  }

  function countUp(el,delay){

        var p=Math.min(1,(ts-start)/1500),e=1-Math.pow(1-p,4);

  function whenSeen(el,fn,threshold){

      io.observe(el);
    }
    setTimeout(go,7000);
  }

    size();

  function draw(){
    ctx.clearRect(0,0,W,H);

    ['top','standings','how','challenges'].forEach(function(id){sio.observe(document.getElementById(id));});
  }
  function setMenu(open){nav.classList.toggle('open',open);document.getElementById('burger').setAttribute('aria-expanded',open?'true':'false');}
  document.getElementById('burger').addEventListener('click',function(){setMenu(!nav.classList.contains('open'));});

  document.addEventListener('click',function(ev){
    var a=ev.target.closest('a[data-nav]');
    if(a){
      var t=document.getElementById(a.dataset.nav);
      if(t){ev.preventDefault();setMenu(false);t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}
      return;
    }
    var b=ev.target.closest('button[data-cheer]');
    if(b){
      var cr=cv.getBoundingClientRect(),br=b.getBoundingClientRect();
      burst(br.left+br.width/2-cr.left,br.top+br.height/2-cr.top,b.dataset.cheer);
      b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
    }
  });

  /* ---------- intro: logo splash that flies into the nav ---------- */
  function runIntro(cb){
    var called=false;function done(){if(called)return;called=true;cb();}
    var seenIntro=false;
    try{seenIntro=sessionStorage.getItem('spirit-intro')==='1';}catch(e){}
    if(reduce||seenIntro||!document.body.animate){done();return;}
    try{sessionStorage.setItem('spirit-intro','1');}catch(e){}
    var root=document.documentElement,finished=false,leaving=false;
    var ov=document.createElement('div');ov.className='intro';ov.setAttribute('aria-hidden','true');
    ov.innerHTML='<div class="intro-ring"></div><div class="intro-ring r2"></div>'
      +'<div class="intro-tag">'+esc(school?school:'Spirit Points')+'</div>'
      +'<div class="intro-sub">'+(school?'Spirit Points · ':'')+'Live class standings</div>'
      +'<div class="intro-bar"><i></i></div><button class="intro-skip" type="button">Skip</button>';
    var logo=document.createElement('span');logo.className='intro-logo logo-img';
    document.body.appendChild(ov);document.body.appendChild(logo);
    document.body.classList.add('intro-on');
    var prevOverflow=root.style.overflow;root.style.overflow='hidden';
    window.scrollTo(0,0);
    logo.animate([
      {transform:'scale(.55) rotate(-8deg)',opacity:0,filter:'blur(10px)'},
      {transform:'scale(1.06) rotate(1deg)',opacity:1,filter:'blur(0px)',offset:.7},
      {transform:'scale(1) rotate(0deg)',opacity:1,filter:'blur(0px)'}
    ],{duration:1000,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
    function finish(){
      if(finished)return;finished=true;
      ov.remove();logo.remove();
      document.body.classList.remove('intro-on');
      root.style.overflow=prevOverflow;
      var m=document.getElementById('nav-mark');
      if(m){m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop');}
    }
    function leave(){
      if(leaving)return;leaving=true;
      clearTimeout(timer);
      try{
        ov.classList.add('leaving');
        var target=document.querySelector('#nav-mark .logo-img');
        var L=logo.getBoundingClientRect(),T=target.getBoundingClientRect();
        var dx=(T.left+T.width/2)-(L.left+L.width/2),dy=(T.top+T.height/2)-(L.top+L.height/2),sc=T.width/L.width;
        var cx=T.left+T.width/2,cy=T.top+T.height/2;
        var ease='cubic-bezier(.7,0,.18,1)';
        logo.getAnimations().forEach(function(a){a.cancel();});
        var fly=logo.animate([
          {transform:'translate(0,0) scale(1) rotate(0deg)'},
          {transform:'translate('+(dx*.12)+'px,'+(dy*.12-24)+'px) scale(1.08) rotate(-4deg)',offset:.22},
          {transform:'translate('+dx+'px,'+dy+'px) scale('+sc+') rotate(0deg)'}
        ],{duration:1050,easing:ease,fill:'forwards'});
        ov.animate([
          {clipPath:'circle(150% at '+cx+'px '+cy+'px)'},
          {clipPath:'circle(0px at '+cx+'px '+cy+'px)'}
        ],{duration:950,delay:120,easing:ease,fill:'forwards'});
        setTimeout(done,260);
        fly.onfinish=finish;
        setTimeout(finish,1500);
      }catch(e){finish();done();}
    }
    ov.addEventListener('click',leave);
    document.addEventListener('keydown',function k(){document.removeEventListener('keydown',k);leave();});
    var timer=setTimeout(leave,1900);
  }

  /* ---------- boot ---------- */
  var introDone=false,dataReady=false,startedPage=false;
  function maybeStart(){
    if(!introDone||!dataReady||startedPage)return;
    startedPage=true;
    var hero=document.getElementById('hero');
    if(!reduce){hero.classList.add('enter');setTimeout(function(){hero.classList.remove('enter');},2600);}
    animateIn();
  }
  function sig(entries){return JSON.stringify(entries);}
  function load(isRefresh){
    return fetchScores().then(function(entries){
      var before=sig(state.entries),prevCount=state.entries.length;
      state.entries=entries;state.loaded=true;state.error='';state.checkedAt=Date.now();state.cached=false;
      try{localStorage.setItem(CACHE_KEY,JSON.stringify({entries:entries,at:state.checkedAt}));}catch(e){}
      var changed=before!==sig(entries);
      var raceChanged=render();
      if(isRefresh&&changed){
        if(raceChanged)playRace(false);
        if(entries.length>prevCount){
          var newest=newestFirst(entries)[0],best=null;
          GRADES.forEach(function(g){var p=Number(newest.points[g.id]||0);if(p>0&&(!best||p>newest.points[best]))best=g.id;});
          toast('New points: '+newest.challenge);
          if(best){var cr=cv.getBoundingClientRect();burst(cr.width/2,cr.height*.4,best);}
        } else toast('Standings updated');
      }
    }).catch(function(){
      state.error=state.entries.length?'':'load';
      if(!state.entries.length)state.loaded=false;
      render();
    });
  }

  seed();
  if(reduce)draw();else start();
  window.addEventListener('resize',function(){var ow=W||1,oh=H||1;size();parts.forEach(function(p){if(p.amb){p.x=p.x/ow*W;p.y=p.y/oh*H;}});if(reduce)draw();});
  if('IntersectionObserver' in window){new IntersectionObserver(function(es){heroVisible=es[0].isIntersecting;heroVisible?start():stop();}).observe(document.getElementById('top'));}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){stop();}else{start();load(true);}
  });

  render();
  var firstLoad=load(false);
  firstLoad.then(function(){dataReady=true;maybeStart();});
  setTimeout(function(){dataReady=true;maybeStart();},3500);
  runIntro(function(){introDone=true;maybeStart();});
  setInterval(function(){if(!document.hidden)load(true);},Math.max(15,CONFIG.refreshSeconds)*1000);
})();

</script>
</body>
</html>
