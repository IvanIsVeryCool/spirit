<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nueva Spirit Cabinet</title>
<meta name="description" content="Nueva Spirit Cabinet: spirit points, the weekly newsletter, events and the people behind Nueva spirit.">
<meta name="theme-color" content="#04081A">
<meta property="og:title" content="Nueva Spirit Cabinet">
<meta property="og:description" content="Spirit points, the weekly newsletter, events and more. All aboard.">
<meta property="og:image" content="/share.png">
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script>
<link rel="modulepreload" href="/vendor/three.module.min.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a full-screen 3D station; the train's doors are the site's sections, labelled in place, with a thin HUD and a door list along the bottom. */
:root{
  --bg:#04081A; --ink:#EAF0FF; --muted:rgba(234,240,255,.58); --faint:rgba(234,240,255,.32); --line:rgba(234,240,255,.14);
  --accent:#4C7DFF; --ice:#A8D4FF; --live:#7CF0B0;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --logo:url("/assets/logo.png");
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:4px;border-radius:6px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.logo-img{display:block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}

#station{position:fixed;inset:0;width:100%;height:100%;display:block}
.grain{position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:.06;background-image:var(--grain);animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 50%,rgba(2,4,14,.8) 100%)}

/* HUD */
.hud{position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-inline:clamp(16px,3vw,40px);pointer-events:none}
.hud>*{pointer-events:auto}
.hud-top{top:0;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo-img{width:34px;height:34px;color:var(--ink);flex:none}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text b{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand-text span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.sound{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 0;transition:color .3s}
.sound:hover,.sound.on{color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:2px;height:14px}
.bars i{display:block;width:2px;height:3px;background:currentColor;border-radius:1px}
.sound.on .bars i{animation:eq 1s ease-in-out infinite}
.sound.on .bars i:nth-child(2){animation-delay:-.4s}.sound.on .bars i:nth-child(3){animation-delay:-.7s}.sound.on .bars i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

/* Title block */
.intro{position:fixed;z-index:5;left:clamp(16px,3vw,40px);bottom:calc(92px + env(safe-area-inset-bottom,0px));pointer-events:none;max-width:min(620px,calc(100% - 32px))}
@media (max-width:760px){.intro{bottom:auto;top:calc(78px + env(safe-area-inset-top,0px))}.intro h1{font-size:clamp(28px,9vw,40px)}.intro .sub{font-size:13px;margin-top:8px}}
.kicker{display:flex;align-items:center;gap:12px;color:var(--muted)}
.kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 12px var(--live);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.intro h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(34px,6vw,84px);line-height:.92;letter-spacing:-.02em;margin-top:12px}
.intro .sub{margin-top:14px;color:var(--muted);max-width:40ch;font-size:clamp(14px,1.5vw,17px)}

/* Door labels that float above each door */
#labels{position:fixed;inset:0;z-index:6;pointer-events:none}
.dlabel{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;pointer-events:auto;opacity:0;transform:translate(-50%,-100%) translateY(14px);transition:opacity .6s,filter .4s;will-change:transform;padding:8px 10px}
#labels.show .dlabel{opacity:1}
.dlabel .no{color:var(--faint)}
.dlabel .t{font-family:var(--display);font-weight:700;font-size:clamp(13px,1.3vw,18px);letter-spacing:-.005em;white-space:nowrap;transition:color .3s}
.dlabel .st{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:10px}
.dlabel .st.live{color:var(--live);border-color:rgba(124,240,176,.4)}
.dlabel .st.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live)}
.dlabel .line{width:1px;height:24px;background:linear-gradient(var(--ice),transparent);opacity:.6}
.dlabel.hover .t{color:var(--ice)}
.dlabel.hover .no{color:var(--ink)}
.dlabel.dim{opacity:0!important;pointer-events:none}

/* Door list along the bottom */
.doornav{position:fixed;z-index:20;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:999px;background:rgba(8,16,50,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transition:opacity .8s var(--ease)}
.doornav.show{opacity:1}
.doornav button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:background-color .3s,color .3s}
.doornav button b{color:var(--faint);font-weight:500}
.doornav button:hover,.doornav button.on{background:rgba(234,240,255,.1);color:var(--ink)}
.navarrow{display:none}
@media (max-width:760px){
  .doornav button:not(.on):not(.navarrow){display:none}
  .doornav .navarrow{display:flex;padding:8px 12px;font-size:14px}
  .doornav button.on{min-width:190px;justify-content:center}
}

/* Coming-soon panel */
.soon{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px}
.soon[hidden]{display:none}
.soon-bg{position:absolute;inset:0;background:rgba(2,5,18,.5);opacity:0;transition:opacity .4s}
.soon-card{position:relative;width:min(440px,100%);padding:30px 28px 26px;border-radius:24px;border:1px solid rgba(168,212,255,.28);background:linear-gradient(165deg,rgba(30,52,150,.7),rgba(6,12,44,.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);opacity:0;transform:translateY(16px) scale(.97);transition:opacity .45s,transform .6s var(--ease)}
.soon.open .soon-bg{opacity:1}
.soon.open .soon-card{opacity:1;transform:none}
.soon-card h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,30px);line-height:1.05;margin:10px 0 0}
.soon-card p{color:var(--muted);margin-top:12px}
.soon-card .close{margin-top:22px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:12px 20px;border:1px solid rgba(234,240,255,.4);border-radius:999px;transition:background-color .3s,color .3s}
.soon-card .close:hover{background:var(--ink);color:var(--bg)}

/* White-out as you step through a door */
#flash{position:fixed;inset:0;z-index:45;pointer-events:none;background:radial-gradient(circle at 50% 50%,#EAF3FF 0%,#A8D4FF 40%,#04081A 100%);opacity:0;transition:opacity .45s ease}
#flash.on{opacity:1}

/* Cursor */
.cursor,.cursor-dot{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border-radius:50%;opacity:0!important}
.cursor{width:36px;height:36px;margin:-18px 0 0 -18px;border:1px solid rgba(234,240,255,.55);transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background-color .35s,border-color .35s}
.cursor-dot{width:4px;height:4px;margin:-2px 0 0 -2px;background:var(--ink)}
.cursor.hover{width:64px;height:64px;margin:-32px 0 0 -32px;background:rgba(168,212,255,.12);border-color:var(--ice)}
@media (hover:hover) and (pointer:fine){body.has-cursor,body.has-cursor a,body.has-cursor button{cursor:none}body.has-cursor .cursor,body.has-cursor .cursor-dot{opacity:1!important}}

/* Loader / gate */
#loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;transition:opacity 1.4s cubic-bezier(.4,0,.2,1) .3s,visibility 0s linear 1.8s}
#loader .logo-img{width:72px;height:72px;color:var(--ink);animation:breathe 2.4s ease-in-out infinite;transition:opacity .9s ease .1s,transform 1.2s var(--ease)}
@keyframes breathe{50%{opacity:.55;transform:scale(.96)}}
.load-title{font-family:var(--display);font-weight:700;letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;font-size:14px}
.load-bar{width:min(240px,60vw);height:1px;background:var(--line);position:relative;overflow:hidden}
.load-bar i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.load-pct{color:var(--muted)}
.gate{display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transform:translateY(10px);transition:opacity .8s var(--ease),transform .8s var(--ease);pointer-events:none}
.gate.ready{opacity:1;transform:none;pointer-events:auto}
.enter-btn{position:relative;isolation:isolate;font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;padding:16px 30px;border:1px solid rgba(234,240,255,.4);border-radius:999px;overflow:hidden;transition:border-color .4s,color .4s}
.enter-btn::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .55s var(--ease);z-index:-1}
.enter-btn:hover{color:var(--bg);border-color:var(--ink)}
.enter-btn:hover::before{transform:none}
.quiet-btn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px;transition:color .3s}
.quiet-btn:hover{color:var(--ink)}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
#loader.out .logo-img{animation:none;opacity:0;transform:scale(1.3)}
#loader.out .gate,#loader.out .load-title,#loader.out .load-bar,#loader.out .load-pct{opacity:0;transition:opacity .4s}

.hud,.intro{transition:opacity 1.2s var(--ease),transform 1.4s var(--ease)}
body.pre .hud,body.pre .intro{opacity:0;transform:translateY(12px)}
.hud-top{transition-delay:.9s}.intro{transition-delay:1.2s}

/* Without WebGL or with reduced motion: the doors become a simple list */
body.static #station,body.static .grain,body.static #labels{display:none}
body.static{overflow:auto;background:radial-gradient(120% 80% at 50% 0%,#0C1B5C 0%,var(--bg) 60%)}
body.static .intro{position:relative;left:auto;top:auto;padding:110px clamp(16px,4vw,40px) 0;max-width:none}
body.static .doornav{position:relative;left:auto;bottom:auto;transform:none;opacity:1;flex-direction:column;border-radius:20px;margin:28px clamp(16px,4vw,40px) 40px;max-width:560px}
body.static .doornav button{display:flex!important;font-size:14px;padding:16px 18px;border-radius:14px;justify-content:flex-start}
body.static .doornav .navarrow{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="pre">
<canvas id="station" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div id="loader" role="dialog" aria-label="Loading">
  <span class="logo-img" aria-hidden="true"></span>
  <div class="load-title" id="load-title">Nueva Spirit</div>
  <div class="load-bar"><i id="load-bar"></i></div>
  <div class="load-pct mono" id="load-pct">0%</div>
  <div class="gate" id="gate">
    <button class="enter-btn" id="enter-sound" type="button">Enter with sound</button>
    <button class="quiet-btn" id="enter-quiet" type="button">Enter without sound</button>
  </div>
</div>

<header class="hud hud-top">
  <a class="brand" href="/"><span class="logo-img" aria-hidden="true"></span><span class="brand-text"><b id="brand-name">Nueva Spirit</b><span>Spirit Cabinet</span></span></a>
  <button class="sound" id="sound-btn" type="button" aria-pressed="false"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="sound-label">Sound off</span></button>
</header>

<div class="intro">
  <p class="kicker mono"><span class="dot" aria-hidden="true"></span><span id="kicker">Platform 1 · Now arriving</span></p>
  <h1 id="title">Spirit Cabinet</h1>
  <p class="sub" id="sub">Every car is part of the Spirit Cabinet. Pick a door to step inside.</p>
</div>

<div id="labels"></div>
<nav class="doornav" id="doornav" aria-label="Sections"></nav>

<div class="soon" id="soon" role="dialog" aria-modal="true" aria-labelledby="soon-title" hidden>
  <div class="soon-bg" data-close></div>
  <div class="soon-card">
    <p class="mono" style="color:var(--muted)" id="soon-no"></p>
    <h2 id="soon-title"></h2>
    <p id="soon-text"></p>
    <button class="close" type="button" data-close>Back to the platform</button>
  </div>
</div>

<div id="flash" aria-hidden="true"></div>
<div class="cursor" id="cursor" aria-hidden="true"></div><div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>
<noscript><p style="padding:24px"><a href="/points/">Go to Spirit Points</a></p></noscript>
<script>setTimeout(function(){if(!window.__hubBooted){var l=document.getElementById("loader");if(l)l.remove();document.body.classList.add("static");document.body.classList.remove("pre");}},9000);</script>
<script type="module" src="/hub/hub.js"></script>
</body>
</html>
