<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:description" content="Live class spirit standings, updated after every spirit event.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;500;600;700&family=DotGothic16&display=swap">
<style>
/* Layout: the 3D ride fills the screen; a route display rides along the bottom; on arrival the standings
   open on the station billboard (an HTML panel laid exactly over its face). Same palette and signage as the platform. */
:root{
  --sky-top:#1c2a66; --sky-mid:#7468ab; --sky-low:#ffb07a;
  --paper:#f6f0e5; --ink:#16181f; --muted:#5b5e68; --red:#c9272c; --navy:#132047;
  --board:#17181c; --flap:#f3efe6; --amber:#ffad1f; --green:#7dffa6; --yellow:#ffd23f;
  --sr:#e0473f; --jr:#f2b33d; --so:#3fae8f; --fr:#5c8de0;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Public Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --led:'DotGothic16',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --logo:url("/assets/logo.png");
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 48%,var(--sky-low) 100%);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,p,ol{margin:0}
ol{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.logo-img{display:block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 40%,transparent 60%,rgba(30,12,30,.35) 100%)}

/* the warm light you came through the train door into, fading to the ride */
#cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#fffaf0 0%,#ffe2b8 45%,#ffb07a 100%);transition:opacity 1.1s ease,visibility 0s linear 1.1s}
#cover.out{opacity:0;visibility:hidden;pointer-events:none}
.cv-in{display:flex;flex-direction:column;align-items:center;gap:18px;color:#a2471e}
.cv-in .logo-img{width:54px;height:54px}
.cv-bar{width:150px;height:2px;border-radius:2px;background:rgba(162,71,30,.2);overflow:hidden}
.cv-bar i{display:block;height:100%;background:#a2471e;transform-origin:left;transform:scaleX(0)}

/* HUD: the station sign (back to the platform), skip and sound */
.hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) clamp(16px,3vw,36px) 0;pointer-events:none}
.hud>*{pointer-events:auto}
.sign{display:flex;align-items:stretch;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px -12px rgba(20,10,40,.55);text-decoration:none}
.sign .bar{width:8px;background:var(--red)}
.sign .in{display:flex;align-items:center;gap:12px;padding:9px 16px 9px 12px}
.sign .logo-img{width:34px;height:34px;color:var(--ink)}
.sign b{display:block;font-family:var(--display);font-stretch:118%;font-weight:850;font-size:20px;line-height:1;letter-spacing:-.01em;text-transform:uppercase}
.sign span.sub{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.sign .back{display:flex;align-items:center;gap:6px}
.sign .back svg{width:12px;height:12px}
.hud-r{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:9px;background:#fff;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 10px 30px -12px rgba(20,10,40,.55);transition:background-color .3s,color .3s,opacity .4s}
.pill .bars{display:flex;align-items:flex-end;gap:2px;height:12px}
.pill .bars i{display:block;width:2px;height:3px;background:currentColor;border-radius:1px}
.sound.on{background:var(--red);color:#fff}
.sound.on .bars i{animation:eq 1s ease-in-out infinite}
.sound.on .bars i:nth-child(2){animation-delay:-.4s}.sound.on .bars i:nth-child(3){animation-delay:-.7s}.sound.on .bars i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
#skip{display:none}
body.riding #skip{display:flex}
@media (max-width:640px){.sign b{font-size:16px}.sign .logo-img{width:28px;height:28px}.sign .in{padding:8px 12px 8px 10px;gap:9px}}

/* split-flap cells, as on the platform's departures board */
.flap{display:flex;gap:2px}
.flap i{position:relative;flex:none;display:grid;place-items:center;width:var(--cw,15px);height:calc(var(--cw,15px) * 1.5);border-radius:2px;background:linear-gradient(180deg,#2d2e35 0,#25262c 49%,#1b1c21 51%,#202127 100%);box-shadow:inset 0 -1px 0 rgba(0,0,0,.55),0 1px 1px rgba(0,0,0,.4);font-style:normal;font-weight:700;font-size:calc(var(--cw,15px) * .98);line-height:1;color:var(--flap);text-transform:uppercase}
.flap i::after{content:"";position:absolute;left:0;right:0;top:calc(50% - .5px);height:1px;background:rgba(0,0,0,.8)}
.flap i.go{animation:flip .08s ease-in}
@keyframes flip{50%{transform:perspective(60px) rotateX(-70deg);filter:brightness(.6)}}

/* the route display during the ride */
.route{position:fixed;z-index:20;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);width:min(860px,calc(100% - 32px));background:linear-gradient(180deg,#1f2026,#15161a);border-radius:8px;box-shadow:0 0 0 1px #050506,inset 0 1px 0 rgba(255,255,255,.07),0 30px 60px -20px rgba(10,5,20,.75);overflow:hidden;opacity:0;transition:opacity .8s var(--ease),transform 1s var(--ease)}
body:not(.riding) .route{pointer-events:none}
body.riding .route{opacity:1;transform:translate(-50%,0)}
.r-top{display:flex;align-items:center;gap:14px;padding:9px 14px;background:var(--navy);border-bottom:2px solid #0a0f22;color:#fff}
.r-top .lbl{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.r-top .flap{--cw:15px}
.r-line{position:relative;display:flex;justify-content:space-between;padding:16px 58px 12px}
.r-line::before{content:"";position:absolute;left:64px;right:64px;top:22px;height:4px;border-radius:2px;background:#33343c}
.r-fill{position:absolute;left:64px;top:22px;height:4px;border-radius:2px;background:var(--red);width:0}
.r-stop{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;width:16px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8d909b;white-space:nowrap;transition:color .4s}
.r-stop i{width:16px;height:16px;border-radius:50%;background:#15161a;border:3px solid #4a4c55;transition:border-color .4s,background-color .4s}
.r-stop.past{color:#c9cbd2}.r-stop.past i{border-color:var(--red);background:var(--red)}
.r-stop.next{color:#fff}.r-stop.next i{border-color:var(--yellow);animation:pulse 1.2s ease-in-out infinite}
.r-stop:last-child i{width:20px;height:20px;margin-top:-2px;border-width:4px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,210,63,.18)}}
.r-train{position:absolute;top:15px;left:32px;width:30px;height:18px;margin-left:-15px;color:#fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
@media (max-width:640px){.r-line{padding:16px 30px 30px}.r-line::before{left:36px;right:36px}.r-fill{left:36px}.r-stop span{display:none}.r-stop.next span{display:block;position:absolute;top:22px;left:50%;transform:translateX(-50%)}.r-stop.next:first-child span{left:0;transform:none}.r-stop.next:last-child span{left:auto;right:0;transform:none}#sound-label{display:none}.pill{padding:9px 12px}}

/* station name pins over the map */
#pins{position:fixed;inset:0;z-index:10;pointer-events:none}
.pin{position:absolute;left:0;top:0;display:flex;align-items:stretch;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 8px 24px -10px rgba(20,10,40,.6);font-family:var(--display);font-stretch:112%;font-weight:850;font-size:13px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity .5s}
.pin::before{content:"";width:5px;background:var(--red)}
.pin span{padding:5px 10px 5px 8px}
.pin.show{opacity:1}
.pin.past{opacity:.55}

/* the billboard: standings and results on the station sign's face */
.bboard{position:fixed;z-index:15;left:0;top:0;width:0;height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#1f2026,#15161a);color:var(--flap);border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #0a0b0e,0 0 60px -10px rgba(255,190,120,.35);opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
body.boarded .bboard{opacity:1;visibility:visible;transition:opacity .9s ease}
.bb-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px clamp(14px,2vw,22px);background:var(--navy);border-bottom:2px solid #0a0f22}
.bb-title{display:flex;align-items:center;gap:12px;min-width:0}
.bb-title .logo-img{width:30px;height:30px;color:#fff;flex:none}
.bb-title h1{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(20px,2.4vw,28px);line-height:1;letter-spacing:.01em;text-transform:uppercase;color:#fff;white-space:nowrap}
.bb-title .season{font-size:12px;font-weight:700;letter-spacing:.1em;color:#aab4d6;text-transform:uppercase;white-space:nowrap}
.live{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#cfd6ee;white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.bb-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:clamp(14px,2vw,22px);scrollbar-width:thin;scrollbar-color:#3a3c44 transparent}
.status{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:clamp(17px,1.9vw,22px);color:#fff}
.status b{color:var(--yellow);font-weight:800}
.cols{display:grid;grid-template-columns:44px minmax(0,1fr) auto 140px;gap:14px;align-items:center;padding:16px 10px 4px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8d909b}
.cols span:nth-child(3){text-align:right}
.stand{display:flex;flex-direction:column;gap:4px}
.row{width:100%;text-align:left;border-radius:6px;transition:background-color .2s;position:relative}
.row::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--c);opacity:.9}
.row:hover,.row[aria-expanded="true"]{background:rgba(255,255,255,.05)}
.row .main{display:grid;grid-template-columns:44px minmax(0,1fr) auto 140px;gap:14px;align-items:center;padding:9px 10px}
.row .rk{--cw:16px}
.row .nm{display:flex;align-items:baseline;gap:10px;min-width:0}
.row .nm b{font-family:var(--display);font-stretch:112%;font-weight:850;font-size:clamp(18px,2vw,24px);line-height:1.1;text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .yr{font-size:12px;font-weight:700;color:#8d909b}
.row.lead .nm b::after{content:"";display:inline-block;width:9px;height:9px;margin-left:10px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow);vertical-align:middle}
.row .pts{--cw:18px;justify-content:flex-end}
.row .meter{height:8px;border-radius:4px;background:#2a2b31;overflow:hidden}
.row .meter i{display:block;height:100%;width:var(--w,0%);background:var(--c);border-radius:4px;transition:width 1.4s var(--ease)}
.row .stats{display:grid;grid-template-columns:repeat(5,auto);justify-content:start;gap:4px 26px;padding:0 10px 12px 68px;font-size:12px;color:#b9bcc6;max-height:0;overflow:hidden;opacity:0;transition:max-height .5s var(--ease),opacity .4s,padding .4s}
.row[aria-expanded="true"] .stats{max-height:120px;opacity:1}
.stats dt{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7d808b}
.stats dd{margin:0;font-weight:700;color:#fff;font-size:15px}
.stats div{display:flex;flex-direction:column-reverse}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding:10px 0 8px;border-top:1px solid #2c2d33}
.sec-h h2{font-family:var(--display);font-stretch:112%;font-weight:850;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:#25262c;font-size:12px;font-weight:700;letter-spacing:.04em;color:#c9cbd2;transition:background-color .2s,color .2s}
.filter i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.filter:hover{background:#30313a;color:#fff}
.filter.on{background:var(--flap);color:var(--ink)}
.f-summary{font-size:13px;color:#b9bcc6;min-height:1.5em;margin:2px 0 6px}
.f-summary b{color:#fff}
.res{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:40px 64px minmax(0,1fr) auto 70px;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:6px;border-bottom:1px solid #24252b;transition:background-color .2s}
.ev:hover{background:rgba(255,255,255,.05)}
.ev .no{font-family:var(--led);font-size:15px;color:var(--amber)}
.ev .dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8d909b}
.ev .name{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .who{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#d6d8de;white-space:nowrap}
.ev .who i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ev .aw{text-align:right;font-weight:700;color:#fff}
.ev .aw small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7d808b;font-weight:700}
.ev.fresh{animation:fresh 2.4s ease 3}
@keyframes fresh{50%{background:rgba(255,210,63,.14)}}
.empty{padding:22px 10px;color:#9a9da7}
.bb-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid #2c2d33;font-size:12px;color:#8d909b}
.bb-foot a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;transition:background-color .2s}
.bb-foot a:hover{background:#a61e22}
@media (max-width:760px){
  .cols{display:none}
  .row .main{grid-template-columns:36px minmax(0,1fr) auto;gap:10px;padding:10px 8px}
  .row .meter{grid-column:2 / 4;margin-top:-2px}
  .row .rk{--cw:13px}.row .pts{--cw:14px}
  .row .stats{grid-template-columns:repeat(3,auto);padding-left:54px;gap:8px 18px}
  .row[aria-expanded="true"] .stats{max-height:160px}
  .ev{grid-template-columns:34px minmax(0,1fr) auto;gap:10px}
  .ev .dt,.ev .aw{display:none}
}

/* an event's full breakdown, printed like a ticket */
.detail{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px}
.detail[hidden]{display:none}
.d-bg{position:absolute;inset:0;background:rgba(28,18,40,.45);opacity:0;transition:opacity .4s}
.d-card{position:relative;width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--paper);border-radius:12px;box-shadow:0 40px 90px -30px rgba(20,10,30,.8);opacity:0;transform:translateY(18px) rotate(-1deg);transition:opacity .4s,transform .6s var(--ease)}
.detail.open .d-bg{opacity:1}.detail.open .d-card{opacity:1;transform:none}
.d-top{background:var(--red);color:#fff;padding:10px 20px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.d-body{padding:20px 22px 22px}
.d-body h3{font-family:var(--display);font-stretch:118%;font-weight:850;font-size:clamp(24px,3.4vw,32px);line-height:1;text-transform:uppercase}
.d-body h4{margin:20px 0 8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d-places li{display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px dashed rgba(22,24,31,.18)}
.d-places .pl{font-weight:800;color:var(--muted)}
.d-places .nm{font-weight:700}
.d-places .pt{font-weight:800}
.d-places .bar{grid-column:2 / 4;height:6px;border-radius:3px;background:rgba(22,24,31,.08);overflow:hidden}
.d-places .bar i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:3px}
.d-after li{display:grid;grid-template-columns:22px 1fr auto 46px;gap:10px;padding:5px 0;font-size:14px}
.d-after .mv{text-align:right;font-weight:800;font-size:12px}
.mv.up{color:#1f8a4c}.mv.down{color:var(--red)}.mv.same{color:var(--muted)}
.d-close{margin-top:20px;background:var(--ink);color:#fff;border-radius:999px;padding:12px 20px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:background-color .25s}
.d-close:hover{background:var(--red)}

.toast{position:fixed;z-index:45;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em;box-shadow:0 14px 34px -14px rgba(10,5,20,.8);opacity:0;pointer-events:none;transition:opacity .4s,transform .6s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* no WebGL or reduced motion: the billboard is the page */
body.static{overflow:auto}
body.static #gl,body.static .vignette,body.static .route,body.static #pins{display:none}
body.static .bboard{position:relative;opacity:1;visibility:visible;width:min(980px,calc(100% - 24px))!important;height:auto!important;left:auto!important;top:auto!important;margin:96px auto 40px}
body.static .bb-scroll{overflow:visible}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="pre">
<canvas id="gl" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div id="cover" aria-hidden="true"><div class="cv-in"><span class="logo-img"></span><div class="cv-bar"><i id="cv-bar"></i></div></div></div>

<header class="hud">
  <a class="sign" href="/" aria-label="Back to the platform"><span class="bar"></span><span class="in"><span class="logo-img" aria-hidden="true"></span><span><b>Nueva</b><span class="sub back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Spirit Line</span></span></span></a>
  <div class="hud-r">
    <button class="pill" id="skip" type="button">Skip</button>
    <button class="pill sound" id="sound-btn" type="button" aria-pressed="false"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="sound-label">Sound off</span></button>
  </div>
</header>

<div id="pins" aria-hidden="true"></div>

<div class="route" id="route" aria-live="polite">
  <div class="r-top"><span class="lbl" id="r-lbl">Next stop</span><span class="flap" id="r-next" aria-hidden="true"></span><span class="sr-only" id="r-sr"></span></div>
  <div class="r-line" id="r-line"><span class="r-fill" id="r-fill"></span><svg class="r-train" id="r-train" viewBox="0 0 30 18" aria-hidden="true"><path d="M2 4h20q7 0 7 7v3H2z" fill="#c9272c"/><path d="M2 4h20q7 0 7 7H2z" fill="none" stroke="#fff" stroke-width="1.2"/><rect x="5" y="7" width="4" height="3" rx=".6" fill="#fff"/><rect x="11" y="7" width="4" height="3" rx=".6" fill="#fff"/><rect x="17" y="7" width="4" height="3" rx=".6" fill="#fff"/><circle cx="8" cy="15.5" r="1.8" fill="#16181f"/><circle cx="22" cy="15.5" r="1.8" fill="#16181f"/></svg></div>
</div>

<main class="bboard" id="bboard" aria-labelledby="bb-h1">
  <div class="bb-head">
    <div class="bb-title"><span class="logo-img" aria-hidden="true"></span><div><h1 id="bb-h1">Spirit Points</h1><span class="season" id="season"></span></div></div>
    <div class="live"><span class="dot" aria-hidden="true"></span><span id="live-text">Live</span></div>
  </div>
  <div class="bb-scroll" id="bb-scroll">
    <p class="status" id="status">Loading…</p>
    <div class="cols" aria-hidden="true"><span>Rank</span><span>Class</span><span>Points</span><span></span></div>
    <ol class="stand" id="standings" aria-label="Standings"></ol>
    <div class="sec-h"><h2>Results</h2><div class="filters" id="filters" role="group" aria-label="Show a class"></div></div>
    <p class="f-summary" id="f-summary"></p>
    <ol class="res" id="results" aria-label="Results, newest first"></ol>
    <div class="bb-foot"><a href="/"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back to the platform</a><span id="end-note"></span></div>
  </div>
</main>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-name" hidden>
  <div class="d-bg" data-close></div>
  <div class="d-card">
    <div class="d-top"><span id="d-when"></span><span id="d-total"></span></div>
    <div class="d-body">
      <h3 id="d-name"></h3>
      <h4>Places</h4><ol class="d-places" id="d-places"></ol>
      <h4>Standings after</h4><ol class="d-after" id="d-after"></ol>
      <button class="d-close" type="button" data-close>Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/points/js/app.js"></script>
</body>
</html>
