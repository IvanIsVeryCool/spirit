<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spirit Stack · Nueva Spirit</title>
<meta name="description" content="A falling-block puzzle game: 40 Lines, Blitz, Dig, Versus and Zen.">
<meta name="theme-color" content="#1c2a66">
<meta property="og:title" content="Spirit Stack · Nueva Spirit">
<meta property="og:description" content="A falling-block puzzle game: 40 Lines, Blitz, Dig, Versus and Zen.">
<meta property="og:image" content="https://spirit.ivancui211.workers.dev/share.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --sky-top:#1c2a66; --sky-mid:#5d4f97; --sky-low:#e7926a;
  --ink:#16181f; --red:#c9272c; --navy:#132047; --amber:#ffad1f;
  --well:rgba(11,15,38,.88);
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Public Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:6px; --lift:0 1px 2px rgba(10,8,30,.25),0 6px 18px rgba(10,8,30,.22);
  --logo:url("/assets/logo.png");
  --gut:clamp(16px,3vw,36px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--sky-top)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 60%,var(--sky-low) 100%) fixed;color:#fff;font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.playing{overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
h1,h2,p,dl,dd{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:var(--r)}
[hidden]{display:none!important}
.logo-img{display:block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* HUD: the station sign, back to the platform */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) var(--gut) 0;min-height:58px}
.sign{display:flex;align-items:center;color:#fff;text-decoration:none;padding:4px 2px;filter:drop-shadow(0 1px 1px rgba(20,10,40,.4)) drop-shadow(0 4px 14px rgba(20,10,40,.35))}
.sign:hover{opacity:.85}
.sign .in{display:flex;align-items:center;gap:14px}
.sign .logo-img{width:30px;height:30px}
.sign .in>span:last-child{display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:1px solid rgba(255,255,255,.5)}
.sign b{display:block;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:15px;line-height:1;letter-spacing:.34em;text-transform:uppercase}
.sign .sub{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:9.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.8);line-height:1}
.sign .sub svg{width:12px;height:12px}
.hud-r{display:flex;gap:8px}

/* controls: one family */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 16px;border-radius:var(--r);background:#fff;color:var(--ink);box-shadow:var(--lift);font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:background .15s,transform .15s}
.btn:hover{background:#f1ece2}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:#b02126}
.btn.quiet{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.btn.quiet:hover{background:rgba(255,255,255,.2)}
.btn svg{width:14px;height:14px}

/* menu */
#menu{flex:1;display:flex;flex-direction:column;align-items:center;padding:clamp(20px,5vh,56px) var(--gut) 40px}
#menu h1{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:clamp(34px,6vw,60px);line-height:1;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(20,10,40,.3);text-align:center}
.modes{display:grid;gap:10px;width:min(520px,100%);margin-top:clamp(22px,4vh,40px)}
.mode{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;padding:16px 18px;border-radius:var(--r);background:rgba(255,255,255,.96);color:var(--ink);box-shadow:var(--lift);text-align:left;border-left:4px solid var(--c,var(--red));transition:background .15s,transform .15s}
button.mode:hover{background:#fff;transform:translateX(2px)}
.mode b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.01em;line-height:1.1}
.mode span{grid-column:1;font-size:13.5px;color:#55586a}
.mode em{grid-row:1/3;grid-column:2;font-style:normal;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#55586a;text-align:right}
.mode em strong{display:block;font-size:17px;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
.mode.vs{grid-template-columns:1fr}
.diff{display:flex;gap:6px;margin-top:10px;grid-column:1}
.diff button{flex:1;min-height:36px;border-radius:4px;background:#efe9de;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;transition:background .15s}
.diff button:hover{background:#e3dccd}
.diff button small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.04em;text-transform:none;color:#6a6d7c}
.menu-foot{display:flex;gap:10px;margin-top:18px}
.keys-help{margin-top:22px;font-size:12.5px;color:rgba(255,255,255,.75);text-align:center;max-width:520px}
.keys-help kbd{font-family:var(--display);font-weight:700;font-size:11px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.16)}

/* the game */
#play{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))}
#arena{display:flex;gap:48px;align-items:flex-start;justify-content:center}
.cluster{display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto 1fr;grid-template-areas:"hold well next" "act well next" "stats well next";column-gap:14px}
.hold-box{grid-area:hold;justify-self:end;margin-top:var(--head)}
.next-box{grid-area:next;margin-top:var(--head)}
.act{grid-area:act;justify-self:end;text-align:right;min-height:84px;padding-top:14px}
.stats{grid-area:stats;align-self:end;justify-self:end;text-align:right;display:grid;gap:10px;padding-bottom:4px}
.well{grid-area:well;position:relative}
.well canvas,.box canvas{display:block}
.lbl{font-family:var(--display);font-weight:700;font-size:11px;line-height:1;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);margin:0 0 7px}
.next-box .lbl{text-align:left}
.hold-box .lbl{text-align:right}
.stats dt{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.stats dd{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.stats dd small{font-size:13px;font-weight:700;color:rgba(255,255,255,.62)}
.cluster.bot .stats dd{font-size:18px}
.who{margin:8px 0 0;text-align:center}
.act p{font-family:var(--display);font-weight:800;line-height:1.1;text-transform:uppercase;letter-spacing:.06em;opacity:0}
.act p.on{animation:act 1.9s ease-out forwards}
.act .a1{font-size:17px}
.act .a2{font-size:12.5px;color:var(--amber);margin-top:3px}
.act .a3{font-size:12.5px;color:#9fd9ff;margin-top:3px}
@keyframes act{0%{opacity:0;transform:translateY(3px)}8%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.count{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:var(--display);font-weight:800;font-size:64px;line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.4);pointer-events:none}

/* phones: hold, stats and next across the top, the well(s) under them */
.narrow #arena{flex-direction:column;align-items:stretch;gap:10px;width:100%;padding:0 16px}
.narrow .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.narrow .wells{display:flex;justify-content:center;align-items:flex-start;gap:10px}
.narrow .hold-box,.narrow .next-box{margin-top:0}
.narrow .stats{grid-template-columns:repeat(3,auto);gap:4px 16px;text-align:center;align-self:center}
.narrow .stats dd{font-size:17px}
.narrow .stats dt{font-size:9.5px}
.narrow .act{position:absolute;left:0;right:0;top:calc(var(--head) + 10px);text-align:center;min-height:0;padding:0;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.5)}

/* touch controls */
#touch{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(460px,100%);padding:12px 16px 0}
#touch button{height:54px;border-radius:var(--r);background:rgba(255,255,255,.14);display:grid;place-items:center;touch-action:none;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#touch button.down{background:rgba(255,255,255,.3)}
#touch button.hard{background:var(--red)}
#touch svg{width:22px;height:22px}

/* pause and results */
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(12,14,36,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5;padding:16px}
.card{width:min(380px,100%);padding:24px 24px 20px;border-radius:var(--r);background:#fff;color:var(--ink);box-shadow:var(--lift);border-top:4px solid var(--red)}
.card h2{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#55586a}
.card .big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.card .tag{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:4px;background:#fff1d6;color:#8a5200;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.card dl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 20px;padding-top:16px;border-top:1px solid #e7e2d8}
.card dt{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6a6d7c}
.card dd{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card .row .btn{flex:1}
.card .btn:not(.primary){background:#efe9de;box-shadow:none}
.card .btn:not(.primary):hover{background:#e3dccd}

/* settings */
dialog{width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 24px);padding:0;border:0;border-radius:var(--r);background:#fff;color:var(--ink);box-shadow:0 20px 60px rgba(10,8,30,.45)}
dialog::backdrop{background:rgba(12,14,36,.6)}
.set{padding:22px 24px 20px;display:grid;gap:18px}
.set h2{font-family:var(--display);font-weight:800;font-size:20px}
.set h3{margin:0 0 8px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6a6d7c}
.sl{display:grid;grid-template-columns:110px 1fr 58px;align-items:center;gap:12px;font-size:14px;margin:4px 0}
.sl output{font-family:var(--display);font-weight:700;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.sl input{width:100%;accent-color:var(--red)}
.chk{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.chk label{display:flex;gap:7px;align-items:center}
.chk input{accent-color:var(--red);width:16px;height:16px}
.binds{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.bind{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.bind button{min-width:104px;min-height:32px;padding:0 10px;border-radius:4px;background:#efe9de;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.04em}
.bind button:hover{background:#e3dccd}
.bind button.wait{background:var(--red);color:#fff}
.set .row{display:flex;justify-content:space-between;gap:8px;padding-top:4px}
.set .btn:not(.primary){background:#efe9de;box-shadow:none}
@media (max-width:520px){.binds{grid-template-columns:1fr}.sl{grid-template-columns:90px 1fr 50px}}
@media (max-width:640px){
  .sign b{font-size:13px;letter-spacing:.28em}.sign .logo-img{width:26px;height:26px}.sign .in{gap:11px}.sign .in>span:last-child{padding-left:11px}
  .hud .btn{padding:0 12px}
}
</style>
</head>
<body>
<header class="hud">
  <a class="sign" href="/" aria-label="Back to the platform"><span class="in"><span class="logo-img" aria-hidden="true"></span><span><b>Nueva</b><span class="sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Spirit Line</span></span></span></a>
  <div class="hud-r">
    <button class="btn quiet" id="pause-btn" type="button" hidden>Pause</button>
    <button class="btn quiet" id="sound-btn" type="button" aria-pressed="true">Sound on</button>
  </div>
</header>

<section id="menu">
  <h1>Spirit Stack</h1>
  <div class="modes">
    <button class="mode" type="button" data-mode="sprint" style="--c:#45b6e0"><b>40 Lines</b><span>Clear 40 lines, fast.</span><em data-pb="sprint"></em></button>
    <button class="mode" type="button" data-mode="blitz" style="--c:#ffc93f"><b>Blitz</b><span>Top score in two minutes.</span><em data-pb="blitz"></em></button>
    <button class="mode" type="button" data-mode="dig" style="--c:#8b8e9c"><b>Dig</b><span>Clear 10 rows of garbage.</span><em data-pb="dig"></em></button>
    <div class="mode vs" style="--c:#e23f45"><b>Versus</b><span>Send garbage at a bot until it tops out.</span>
      <div class="diff" role="group" aria-label="Bot difficulty">
        <button type="button" data-mode="versus" data-level="easy">Easy<small data-pb="easy"></small></button>
        <button type="button" data-mode="versus" data-level="normal">Normal<small data-pb="normal"></small></button>
        <button type="button" data-mode="versus" data-level="hard">Hard<small data-pb="hard"></small></button>
      </div>
    </div>
    <button class="mode" type="button" data-mode="zen" style="--c:#4cc182"><b>Zen</b><span>No clock, no game over.</span><em data-pb="zen"></em></button>
  </div>
  <div class="menu-foot"><button class="btn" id="settings-btn" type="button">Settings</button></div>
  <p class="keys-help" id="keys-help"></p>
</section>

<section id="play" hidden>
  <div id="arena"></div>
  <div id="touch" hidden>
    <button type="button" data-act="hold" aria-label="Hold">Hold</button>
    <button type="button" data-act="ccw" aria-label="Rotate left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v5h5"/><path d="M5.5 15a7 7 0 1 0 1.2-7.6L4 10"/></svg></button>
    <button type="button" data-act="r180" aria-label="Rotate 180">180</button>
    <button type="button" data-act="cw" aria-label="Rotate right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5v5h-5"/><path d="M18.5 15a7 7 0 1 1-1.2-7.6L20 10"/></svg></button>
    <button type="button" data-act="left" aria-label="Move left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" data-act="soft" aria-label="Soft drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
    <button type="button" data-act="right" aria-label="Move right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button type="button" data-act="hard" class="hard" aria-label="Hard drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6 6-6M6 12l6 6 6-6"/></svg></button>
  </div>
  <div id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-h"></div></div>
</section>

<dialog id="settings" aria-labelledby="set-h">
  <form class="set" method="dialog">
    <h2 id="set-h">Settings</h2>
    <div>
      <h3>Handling</h3>
      <label class="sl">Auto-shift delay<input type="range" id="s-das" min="0" max="300" step="1"><output id="o-das"></output></label>
      <label class="sl">Auto-repeat<input type="range" id="s-arr" min="0" max="100" step="1"><output id="o-arr"></output></label>
      <label class="sl">Soft drop speed<input type="range" id="s-sdf" min="5" max="41" step="1"><output id="o-sdf"></output></label>
    </div>
    <div>
      <h3>Look and sound</h3>
      <div class="chk"><label><input type="checkbox" id="s-ghost">Ghost piece</label><label><input type="checkbox" id="s-grid">Grid</label></div>
      <label class="sl">Volume<input type="range" id="s-vol" min="0" max="100" step="1"><output id="o-vol"></output></label>
    </div>
    <div>
      <h3>Keys <span style="text-transform:none;letter-spacing:0;font-weight:500">(click, then press a key)</span></h3>
      <div class="binds" id="binds"></div>
    </div>
    <div class="row"><button class="btn" type="button" id="s-reset">Defaults</button><button class="btn primary" value="close">Done</button></div>
  </form>
</dialog>

<script type="module" src="/stack/game.js"></script>
</body>
</html>
